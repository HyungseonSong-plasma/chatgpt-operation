name: Samuel Bootstrap

on:
  issues:
    types: [opened, reopened, labeled]
  pull_request:
    types: [opened, reopened, synchronize, closed]
  issue_comment:
    types: [created]
  schedule:
    - cron: '55 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: samuel-bootstrap
  cancel-in-progress: false

jobs:
  wake:
    if: ${{ github.event_name != 'issue_comment' || contains(github.event.comment.body, '<!-- samuel-reasoning-submission -->') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Persist bootstrap heartbeat evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          marker='<!-- samuel-bootstrap-heartbeat -->'
          payload="$(python3 - <<'PY'
          import json, os
          print(json.dumps({
              "schema_version": 1,
              "event_name": os.environ["GITHUB_EVENT_NAME"],
              "event_action": os.environ.get("GITHUB_EVENT_ACTION", ""),
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "head_sha": os.environ["GITHUB_SHA"],
              "ref": os.environ["GITHUB_REF"],
          }, sort_keys=True, separators=(",", ":")))
          PY
          )"
          body="$marker
          \`\`\`json
          $payload
          \`\`\`"
          comments="$(gh api "repos/$GITHUB_REPOSITORY/issues/44/comments?per_page=100")"
          comment_id="$(python3 -c 'import json,sys; m="<!-- samuel-bootstrap-heartbeat -->"; xs=json.load(sys.stdin); ids=[x["id"] for x in xs if m in x.get("body","")]; assert len(ids)<=1; print(ids[0] if ids else "")' <<<"$comments")"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/44/comments" -f body="$body" >/dev/null
          fi
      - name: Admit explicitly labeled issue work
        if: ${{ github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'samuel') }}
        env:
          PYTHONPATH: src
          GH_TOKEN: ${{ github.token }}
          ISSUE_JSON: ${{ toJSON(github.event.issue) }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/issues/44/comments?per_page=100" > admission-comments.json
          python3 - <<'PY'
          import json, os
          from chatgpt_operation.controller.issue_ingestion import admit_issue
          comments=json.load(open("admission-comments.json"))
          issue=json.loads(os.environ["ISSUE_JSON"])
          write=admit_issue(comments,issue)
          open("samuel-admission-body.txt","w").write(write["body"])
          open("samuel-admission-comment-id.txt","w").write(
              "" if write["comment_id"] is None else str(write["comment_id"])
          )
          print("SAMUEL_ADMISSION="+("NEW" if write["changed"] else "NOOP")+" work_id="+write["work_id"])
          PY
          body="$(cat samuel-admission-body.txt)"
          comment_id="$(cat samuel-admission-comment-id.txt)"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/44/comments" -f body="$body" >/dev/null
          fi

      - name: Load durable controller state and select work
        env:
          PYTHONPATH: src
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/issues/44/comments?per_page=100" > samuel-issue-comments.json
          python3 - <<'PY'
          import json
          from chatgpt_operation.controller.bootstrap import load_pending, select_controller_work
          from chatgpt_operation.controller.durable_state import load_state_comment
          from chatgpt_operation.controller.issue_ingestion import ADMISSION_MARKER, decode_admission_ledger

          comments=json.load(open("samuel-issue-comments.json"))
          state=load_state_comment(comments)
          pending=load_pending("automation/samuel/bootstrap.json")
          admission=[c for c in comments if ADMISSION_MARKER in str(c.get("body",""))]
          if len(admission)>1:
              raise SystemExit("SAMUEL_BOOTSTRAP=HARD_STOP multiple admission ledgers")
          admitted={} if not admission else decode_admission_ledger(str(admission[0]["body"]))
          selected=select_controller_work(
              pending,
              diagnostic_recoveries={} if state is None else state.diagnostic_recoveries,
              action_queue={} if state is None else state.action_queue,
              admitted_work=admitted,
          )
          if selected is None:
              payload={"kind":"idle"}
          elif selected[0] in {
              "diagnostic", "action", "action_intent", "action_observation",
              "evidence", "issue",
          }:
              payload={"kind":selected[0], **selected[1]}
          else:
              work=selected[1]
              payload={
                  "kind":"pending",
                  "work_id":work.work_id,
                  "workflow":work.workflow,
                  "ref":work.ref,
              }
          open("samuel-selected-work.json","w").write(
              json.dumps(payload,sort_keys=True,separators=(",",":"))
          )
          print("SAMUEL_SELECTED_WORK="+payload["kind"])
          PY

      - name: Persist guarded Issue planning evidence
        if: ${{ hashFiles('samuel-selected-work.json') != '' }}
        env:
          PYTHONPATH: src
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from chatgpt_operation.controller.decisions import DecisionRegistry
          from chatgpt_operation.controller.issue_planning import plan_admitted_issue
          from chatgpt_operation.controller.reasoning_provider import ReasoningProviderRegistry

          selected=json.load(open("samuel-selected-work.json"))
          if selected.get("kind") != "issue":
              raise SystemExit(0)
          registry=DecisionRegistry.load("automation/samuel/decisions.json")
          result=plan_admitted_issue(selected,registry=registry)
          provider=ReasoningProviderRegistry()
          provider_status=provider.status()
          payload={
              "schema_version":1,
              "work_id":result.work_id,
              "outcome":"reasoning_required" if not provider_status.available else result.outcome.value,
              "reason":"external semantic reasoning worker required" if not provider_status.available else result.reason,
              "blocker":None,
              "semantic_provider":{
                  "available":provider_status.available,
                  "provider":provider_status.provider,
              },
              "action_plan":result.action_plan,
              "reasoning_context":result.envelope.as_reasoning_context(),
          }
          open("samuel-issue-planning.json","w").write(
              json.dumps(payload,sort_keys=True,separators=(",",":"))
          )
          if payload["outcome"] == "reasoning_required":
              open("samuel-reasoning-required-work-id.txt","w").write(result.work_id)
          print("SAMUEL_ISSUE_PLANNING="+payload["outcome"].upper()+" work_id="+result.work_id)
          PY
          if [ -f samuel-reasoning-required-work-id.txt ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/44/comments?per_page=100" > lifecycle-comments.json
            python3 - <<'PY'
          import json
          from chatgpt_operation.controller.issue_ingestion import (
              ADMISSION_MARKER, decode_admission_ledger, encode_admission_ledger,
              transition_issue_status,
          )
          comments=json.load(open("lifecycle-comments.json"))
          matches=[c for c in comments if ADMISSION_MARKER in str(c.get("body",""))]
          if len(matches)!=1:
              raise SystemExit("SAMUEL_REASONING=HARD_STOP admission ledger missing or ambiguous")
          work=decode_admission_ledger(str(matches[0]["body"]))
          work_id=open("samuel-reasoning-required-work-id.txt").read().strip()
          updated=transition_issue_status(work,work_id,"reasoning_required")
          open("samuel-admission-body.txt","w").write(encode_admission_ledger(updated))
          open("samuel-admission-comment-id.txt","w").write(str(matches[0]["id"]))
          PY
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$(cat samuel-admission-comment-id.txt)" -f body="$(cat samuel-admission-body.txt)" >/dev/null
          fi
          if [ ! -f samuel-issue-planning.json ]; then exit 0; fi
          marker='<!-- samuel-issue-planning -->'
          body="$marker
          ~~~json
          $(cat samuel-issue-planning.json)
          ~~~"
          comments="$(gh api "repos/$GITHUB_REPOSITORY/issues/44/comments?per_page=100")"
          comment_id="$(python3 -c 'import json,sys; m="<!-- samuel-issue-planning -->"; xs=json.load(sys.stdin); ids=[x["id"] for x in xs if m in x.get("body","")]; assert len(ids)<=1; print(ids[0] if ids else "")' <<<"$comments")"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/44/comments" -f body="$body" >/dev/null
          fi

      - name: Consume external reasoning submission
        env:
          PYTHONPATH: src
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/issues/44/comments?per_page=100" > reasoning-comments.json
          python3 - <<'PY'
          import json
          from chatgpt_operation.controller.decisions import DecisionRegistry
          from chatgpt_operation.controller.durable_state import load_state_comment, state_write_request
          from chatgpt_operation.controller.issue_ingestion import (
              ADMISSION_MARKER, decode_admission_ledger, encode_admission_ledger, transition_issue_status,
          )
          from chatgpt_operation.controller.reasoning_consumption import consume_reasoning_submission

          comments=json.load(open("reasoning-comments.json"))
          admission=[c for c in comments if ADMISSION_MARKER in str(c.get("body",""))]
          if len(admission)!=1:
              raise SystemExit(0)
          work=decode_admission_ledger(str(admission[0]["body"]))
          waiting=sorted(k for k,v in work.items() if v.get("status")=="reasoning_required")
          planned=sorted(k for k,v in work.items() if v.get("status")=="planned")
          state=load_state_comment(comments)
          if planned and state is None:
              if len(planned)!=1:
                  raise SystemExit("SAMUEL_REASONING=HARD_STOP multiple planned work items without durable state")
              # Recover only from the already durable typed submission; never invent a plan.
              work=transition_issue_status(work,planned[0],"reasoning_required")
              waiting=[planned[0]]
              print("SAMUEL_REASONING=RECOVER_PARTIAL_COMMIT work_id="+planned[0])
          if not waiting:
              raise SystemExit(0)
          if len(waiting)>1:
              raise SystemExit("SAMUEL_REASONING=HARD_STOP multiple reasoning-required work items")
          if state is None:
              from chatgpt_operation.controller.research import ResearchState
              item=work[waiting[0]]
              state=ResearchState(
                  waiting[0],
                  str(item.get("title") or item.get("body") or waiting[0]),
              )
              print("SAMUEL_REASONING=INITIALIZED durable controller state work_id="+waiting[0])
          registry=DecisionRegistry.load("automation/samuel/decisions.json")
          result=consume_reasoning_submission(
              comments,work,waiting[0],registry=registry,state=state
          )
          print("SAMUEL_REASONING="+result.outcome.upper()+" work_id="+waiting[0])
          if result.outcome=="reasoning_required":
              raise SystemExit(0)
          open("samuel-admission-body.txt","w").write(encode_admission_ledger(result.work))
          open("samuel-admission-comment-id.txt","w").write(str(admission[0]["id"]))
          if result.action_id is not None:
              request=state_write_request(comments,result.state)
              open("samuel-controller-state-write.json","w").write(json.dumps(request,sort_keys=True,separators=(",",":")))
          PY
          if [ -f samuel-admission-body.txt ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$(cat samuel-admission-comment-id.txt)" -f body="$(cat samuel-admission-body.txt)" >/dev/null
          fi
          if [ -f samuel-controller-state-write.json ]; then
            python3 - <<'PY'
          import json, os, subprocess
          from chatgpt_operation.controller.durable_state import decode_state, STATE_MARKER

          request=json.load(open("samuel-controller-state-write.json"))
          args=["gh","api","--method",request["method"]]
          if request["method"]=="POST":
              args.append(f"repos/{os.environ['GITHUB_REPOSITORY']}/issues/44/comments")
          else:
              if not isinstance(request["comment_id"],int):
                  raise SystemExit("SAMUEL_STATE=HARD_STOP invalid PATCH comment id")
              args.append(f"repos/{os.environ['GITHUB_REPOSITORY']}/issues/comments/{request['comment_id']}")
          args.extend(["-f","body="+request["body"]])
          subprocess.run(args,check=True,stdout=subprocess.DEVNULL)

          raw=subprocess.check_output(
              ["gh","api",f"repos/{os.environ['GITHUB_REPOSITORY']}/issues/44/comments?per_page=100"],
              text=True,
          )
          comments=json.loads(raw)
          matches=[c for c in comments if STATE_MARKER in str(c.get("body",""))]
          if len(matches)!=1:
              raise SystemExit(f"SAMUEL_STATE=HARD_STOP expected one durable state, found {len(matches)}")
          persisted=decode_state(str(matches[0]["body"]))
          if persisted.research_id != request["research_id"] or persisted.revision != request["expected_revision"]:
              raise SystemExit(
                  "SAMUEL_STATE=HARD_STOP readback mismatch "
                  f"research_id={persisted.research_id} revision={persisted.revision}"
              )
          print(f"SAMUEL_STATE=PERSISTED research_id={persisted.research_id} revision={persisted.revision}")
          PY
          fi

      - name: Persist durable action dispatch intent
        env:
          PYTHONPATH: src
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          selected_kind="$(python3 -c 'import json; print(json.load(open("samuel-selected-work.json")).get("kind",""))')"
          if [ "$selected_kind" != "action" ]; then exit 0; fi
          gh api "repos/$GITHUB_REPOSITORY/issues/44/comments?per_page=100" > action-intent-comments.json
          python3 - <<'PY'
          import copy, json
          from datetime import datetime, timezone
          from chatgpt_operation.controller.diagnostic import record_action_dispatch_intent
          from chatgpt_operation.controller.durable_state import load_state_comment, state_write_request

          selected=json.load(open("samuel-selected-work.json"))
          comments=json.load(open("action-intent-comments.json"))
          current=load_state_comment(comments)
          if current is None:
              raise SystemExit("SAMUEL_ACTION_INTENT=HARD_STOP durable state missing")
          action_id=selected["action_id"]
          item=current.action_queue.get(action_id)
          if not isinstance(item,dict):
              raise SystemExit("SAMUEL_ACTION_INTENT=HARD_STOP action missing from durable queue")
          status=item.get("status")
          if status in {"dispatch_intent","dispatched","complete"}:
              print("SAMUEL_ACTION_INTENT=NOOP status="+str(status)+" action_id="+action_id)
              raise SystemExit(0)
          if status != "pending":
              raise SystemExit("SAMUEL_ACTION_INTENT=HARD_STOP unexpected status "+str(status))
          proposed=copy.deepcopy(current)
          requested_at=datetime.now(timezone.utc).isoformat().replace("+00:00","Z")
          record_action_dispatch_intent(
              proposed,action_id,workflow="samuel-native-github.yml",ref="main",
              requested_at=requested_at,
          )
          request=state_write_request(comments,proposed)
          open("samuel-action-intent-write.json","w").write(
              json.dumps(request,sort_keys=True,separators=(",",":"))
          )
          PY
          if [ ! -f samuel-action-intent-write.json ]; then exit 0; fi
          gh api "repos/$GITHUB_REPOSITORY/issues/44/comments?per_page=100" > action-intent-prewrite-comments.json
          python3 - <<'PY'
          import json
          from chatgpt_operation.controller.durable_state import validate_state_write_precondition
          comments=json.load(open("action-intent-prewrite-comments.json"))
          request=json.load(open("samuel-action-intent-write.json"))
          validate_state_write_precondition(comments,request)
          PY
          method="$(python3 -c 'import json; print(json.load(open("samuel-action-intent-write.json"))["method"])')"
          comment_id="$(python3 -c 'import json; x=json.load(open("samuel-action-intent-write.json"))["comment_id"]; print("" if x is None else x)')"
          body="$(python3 -c 'import json; print(json.load(open("samuel-action-intent-write.json"))["body"])')"
          if [ "$method" = "PATCH" ]; then
            test -n "$comment_id"
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/44/comments" -f body="$body" >/dev/null
          fi
          gh api "repos/$GITHUB_REPOSITORY/issues/44/comments?per_page=100" > action-intent-readback-comments.json
          python3 - <<'PY'
          import json
          from chatgpt_operation.controller.durable_state import load_state_comment
          request=json.load(open("samuel-action-intent-write.json"))
          selected=json.load(open("samuel-selected-work.json"))
          persisted=load_state_comment(json.load(open("action-intent-readback-comments.json")))
          if persisted is None or persisted.revision != request["expected_revision"]:
              raise SystemExit("SAMUEL_ACTION_INTENT=HARD_STOP readback revision mismatch")
          item=persisted.action_queue.get(selected["action_id"],{})
          if item.get("status") != "dispatch_intent":
              raise SystemExit("SAMUEL_ACTION_INTENT=HARD_STOP intent not durable")
          print("SAMUEL_ACTION_INTENT=PERSISTED action_id="+selected["action_id"])
          PY
      - name: Wake pending Samuel work
        env:
          PYTHONPATH: src
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os
          from chatgpt_operation.controller.bootstrap import load_pending, resolve_bootstrap_provider
          from chatgpt_operation.github.actions_runtime import GitHubActionsTransport, dispatch_and_wait

          repo=os.environ["GITHUB_REPOSITORY"]
          sha=os.environ["GITHUB_SHA"]
          transport=GitHubActionsTransport(repo, os.environ["GITHUB_TOKEN"])
          selected=__import__("json").load(open("samuel-selected-work.json"))
          comments=__import__("json").load(open("samuel-issue-comments.json"))
          if selected.get("kind") == "evidence":
              outcome=dispatch_and_wait(
                  transport, workflow="samuel-evidence-acquisition.yml", ref="main",
                  inputs={
                      "recovery_json":json.dumps(selected,sort_keys=True,separators=(",",":")),
                      "controller_state":next(
                          (str(c.get("body","")) for c in comments
                           if "<!-- samuel-controller-state -->" in str(c.get("body",""))),
                          "",
                      ),
                  },
                  correlation_id="evidence-"+selected["action_id"],
                  correlation_input=None,
                  expected_head_sha=sha if os.environ.get("GITHUB_REF_NAME") == "main" else None,
                  timeout_seconds=600,poll_interval_seconds=5,
              )
              obs=outcome["observation"]
              ids=obs.get("matched_run_ids") or ([obs.get("workflow_run_id")] if obs.get("workflow_run_id") else [])
              if obs.get("status")!="MATCHED_TERMINAL" or obs.get("conclusion")!="success" or len(ids)!=1:
                  raise SystemExit("SAMUEL_BOOTSTRAP=HARD_STOP evidence acquisition "+str(obs))
              open("samuel-evidence-run-id.txt","w").write(str(ids[0])+"\n")
              print("SAMUEL_BOOTSTRAP=EVIDENCE_DISPATCHED action_id="+selected["action_id"])
              raise SystemExit(0)
          if selected.get("kind") in {"action","action_intent","action_observation"}:
              import json, subprocess
              from chatgpt_operation.controller.diagnostic import (
                  resume_dispatch_intent, resume_dispatched_action,
              )
              from chatgpt_operation.controller.durable_state import load_state_comment
              from chatgpt_operation.github.native_orchestration import (
                  dispatch_native_plan_async, observe_native_intent, observe_native_plan,
              )

              fresh=json.loads(subprocess.check_output([
                  "gh","api",f"repos/{repo}/issues/44/comments?per_page=100"
              ],text=True))
              current=load_state_comment(fresh)
              if current is None:
                  raise SystemExit("SAMUEL_BOOTSTRAP=HARD_STOP durable state disappeared")
              action_id=selected["action_id"]
              expected_head=sha if os.environ.get("GITHUB_REF_NAME") == "main" else None

              if selected["kind"] == "action":
                  plan,intent=resume_dispatch_intent(current,action_id)
                  receipt=dispatch_native_plan_async(
                      plan,transport=transport,ref=intent.ref,workflow=intent.workflow,
                  )
                  if isinstance(receipt.get("workflow_run_id"),int):
                      open("samuel-action-dispatch-receipt.json","w").write(
                          json.dumps(receipt,sort_keys=True,separators=(",",":"))
                      )
                      print("SAMUEL_BOOTSTRAP=ACTION_DISPATCH_BOUND action_id="+action_id)
                  else:
                      print("SAMUEL_BOOTSTRAP=ACTION_DISPATCH_UNBOUND action_id="+action_id)
                  raise SystemExit(0)

              if selected["kind"] == "action_intent":
                  plan,intent=resume_dispatch_intent(current,action_id)
                  reconciled=observe_native_intent(
                      plan,intent,transport=transport,expected_head_sha=expected_head,
                  )
                  observation=reconciled["observation"]
                  bound=reconciled.get("receipt")
                  if bound is not None:
                      open("samuel-action-dispatch-receipt.json","w").write(
                          json.dumps(bound,sort_keys=True,separators=(",",":"))
                      )
                      print("SAMUEL_BOOTSTRAP=ACTION_RECONCILED action_id="+action_id)
                      raise SystemExit(0)
                  status=observation.get("status")
                  if status in {"PENDING_VISIBILITY","OBSERVATION_INCOMPLETE"}:
                      print("SAMUEL_BOOTSTRAP=ACTION_INTENT_WAIT status="+str(status))
                      raise SystemExit(0)
                  if status == "NO_MATCH":
                      receipt=dispatch_native_plan_async(
                          plan,transport=transport,ref=intent.ref,workflow=intent.workflow,
                      )
                      if isinstance(receipt.get("workflow_run_id"),int):
                          open("samuel-action-dispatch-receipt.json","w").write(
                              json.dumps(receipt,sort_keys=True,separators=(",",":"))
                          )
                          print("SAMUEL_BOOTSTRAP=ACTION_RECOVERY_DISPATCH_BOUND action_id="+action_id)
                      else:
                          print("SAMUEL_BOOTSTRAP=ACTION_RECOVERY_DISPATCH_UNBOUND action_id="+action_id)
                      raise SystemExit(0)
                  raise SystemExit("SAMUEL_BOOTSTRAP=HARD_STOP action intent observation "+str(observation))

              plan,receipt=resume_dispatched_action(current,action_id)
              observation=observe_native_plan(
                  plan,receipt,transport=transport,expected_head_sha=expected_head,
              )
              status=observation.get("status")
              if status == "MATCHED_TERMINAL":
                  run_id=receipt.get("workflow_run_id")
                  if not isinstance(run_id,int):
                      raise SystemExit("SAMUEL_BOOTSTRAP=HARD_STOP dispatched action lost run identity")
                  open("samuel-action-run-id.txt","w").write(str(run_id)+"\n")
                  print("SAMUEL_BOOTSTRAP=ACTION_TERMINAL action_id="+action_id)
                  raise SystemExit(0)
              if status in {"MATCHED_ACTIVE","PENDING_VISIBILITY","NO_MATCH","OBSERVATION_INCOMPLETE"}:
                  print("SAMUEL_BOOTSTRAP=ACTION_OBSERVE_WAIT status="+str(status))
                  raise SystemExit(0)
              raise SystemExit("SAMUEL_BOOTSTRAP=HARD_STOP action observation "+str(observation))
          if selected.get("kind") == "diagnostic":
              outcome=dispatch_and_wait(
                  transport,
                  workflow="samuel-diagnostic-recovery.yml",
                  ref="main",
                  inputs={"recovery_json": __import__("json").dumps(selected,sort_keys=True,separators=(",",":")), "controller_state": next((str(c.get("body","")) for c in comments if "<!-- samuel-controller-state -->" in str(c.get("body",""))), "")},
                  correlation_id="diagnostic:"+selected["action_id"],
                  correlation_input=None,
                  expected_head_sha=sha if os.environ.get("GITHUB_REF_NAME") == "main" else None,
                  timeout_seconds=600,
                  poll_interval_seconds=5,
              )
              observation=outcome["observation"]
              if observation.get("status") != "MATCHED_TERMINAL" or observation.get("conclusion") != "success":
                  raise SystemExit("SAMUEL_BOOTSTRAP=HARD_STOP diagnostic dispatch "+str(observation))
              run_ids=observation.get("matched_run_ids") or ([observation.get("workflow_run_id")] if observation.get("workflow_run_id") else [])
              if len(run_ids) != 1:
                  raise SystemExit("SAMUEL_BOOTSTRAP=HARD_STOP ambiguous diagnostic run "+str(run_ids))
              open("samuel-diagnostic-run-id.txt","w").write(str(run_ids[0])+"\n")
              print("SAMUEL_BOOTSTRAP=DIAGNOSTIC_DISPATCHED action_id="+selected["action_id"])
              raise SystemExit(0)
          pending=load_pending("automation/samuel/bootstrap.json")
          selected_id=selected.get("work_id") if selected.get("kind") == "pending" else None
          pending=[work for work in pending if work.work_id == selected_id]
          if not pending:
              print("SAMUEL_BOOTSTRAP=IDLE")
          for work in pending:
              provider=resolve_bootstrap_provider(work)
              if provider.contract != "github-native-dispatch":
                  raise SystemExit("SAMUEL_BOOTSTRAP=HARD_STOP invalid provider contract")
              print("SAMUEL_BOOTSTRAP_PROVIDER="+provider.name)
              outcome=dispatch_and_wait(
                  transport,
                  workflow=work.workflow,
                  ref=work.ref,
                  inputs={},
                  correlation_id=work.work_id,
                  correlation_input=None,
                  expected_head_sha=sha if work.ref == os.environ.get("GITHUB_REF_NAME") else None,
                  timeout_seconds=600,
                  poll_interval_seconds=5,
              )
              observation=outcome["observation"]
              if observation.get("status") != "MATCHED_TERMINAL" or observation.get("conclusion") != "success":
                  raise SystemExit("SAMUEL_BOOTSTRAP=HARD_STOP "+str(observation))
              run_ids=observation.get("matched_run_ids") or ([observation.get("workflow_run_id")] if observation.get("workflow_run_id") else [])
              if len(run_ids) != 1:
                  raise SystemExit("SAMUEL_BOOTSTRAP=HARD_STOP ambiguous qualification run "+str(run_ids))
              open("samuel-qualified-run-id.txt","w").write(str(run_ids[0])+"\n")
              print("SAMUEL_BOOTSTRAP=PASS "+work.work_id)
          PY

      - name: Persist durable action dispatch receipt
        if: ${{ hashFiles('samuel-action-dispatch-receipt.json') != '' }}
        env:
          PYTHONPATH: src
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/issues/44/comments?per_page=100" > action-receipt-comments.json
          python3 - <<'PY'
          import copy, json
          from chatgpt_operation.controller.diagnostic import record_action_dispatch
          from chatgpt_operation.controller.durable_state import load_state_comment, state_write_request

          comments=json.load(open("action-receipt-comments.json"))
          receipt=json.load(open("samuel-action-dispatch-receipt.json"))
          current=load_state_comment(comments)
          if current is None:
              raise SystemExit("SAMUEL_ACTION_RECEIPT=HARD_STOP durable state missing")
          action_id=receipt.get("correlation_id")
          item=current.action_queue.get(action_id)
          if not isinstance(item,dict):
              raise SystemExit("SAMUEL_ACTION_RECEIPT=HARD_STOP action missing")
          if item.get("status") == "dispatched":
              if item.get("dispatch_receipt") != receipt:
                  raise SystemExit("SAMUEL_ACTION_RECEIPT=HARD_STOP conflicting persisted receipt")
              print("SAMUEL_ACTION_RECEIPT=NOOP action_id="+str(action_id))
              raise SystemExit(0)
          if item.get("status") != "dispatch_intent":
              raise SystemExit("SAMUEL_ACTION_RECEIPT=HARD_STOP action is not awaiting receipt")
          proposed=copy.deepcopy(current)
          record_action_dispatch(proposed,action_id,receipt)
          request=state_write_request(comments,proposed)
          open("samuel-action-receipt-write.json","w").write(
              json.dumps(request,sort_keys=True,separators=(",",":"))
          )
          PY
          if [ ! -f samuel-action-receipt-write.json ]; then exit 0; fi
          gh api "repos/$GITHUB_REPOSITORY/issues/44/comments?per_page=100" > action-receipt-prewrite-comments.json
          python3 - <<'PY'
          import json
          from chatgpt_operation.controller.durable_state import validate_state_write_precondition
          validate_state_write_precondition(
              json.load(open("action-receipt-prewrite-comments.json")),
              json.load(open("samuel-action-receipt-write.json")),
          )
          PY
          method="$(python3 -c 'import json; print(json.load(open("samuel-action-receipt-write.json"))["method"])')"
          comment_id="$(python3 -c 'import json; x=json.load(open("samuel-action-receipt-write.json"))["comment_id"]; print("" if x is None else x)')"
          body="$(python3 -c 'import json; print(json.load(open("samuel-action-receipt-write.json"))["body"])')"
          if [ "$method" = "PATCH" ]; then
            test -n "$comment_id"
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/44/comments" -f body="$body" >/dev/null
          fi
          gh api "repos/$GITHUB_REPOSITORY/issues/44/comments?per_page=100" > action-receipt-readback-comments.json
          python3 - <<'PY'
          import json
          from chatgpt_operation.controller.durable_state import load_state_comment
          request=json.load(open("samuel-action-receipt-write.json"))
          receipt=json.load(open("samuel-action-dispatch-receipt.json"))
          persisted=load_state_comment(json.load(open("action-receipt-readback-comments.json")))
          if persisted is None or persisted.revision != request["expected_revision"]:
              raise SystemExit("SAMUEL_ACTION_RECEIPT=HARD_STOP readback revision mismatch")
          item=persisted.action_queue.get(receipt["correlation_id"],{})
          if item.get("status") != "dispatched" or item.get("dispatch_receipt") != receipt:
              raise SystemExit("SAMUEL_ACTION_RECEIPT=HARD_STOP receipt not durable")
          print("SAMUEL_ACTION_RECEIPT=PERSISTED action_id="+receipt["correlation_id"])
          PY
