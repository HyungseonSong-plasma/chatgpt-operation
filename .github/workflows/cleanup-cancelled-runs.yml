name: Cleanup Cancelled Workflow Runs

on:
  push:
    paths:
      - '.github/workflows/cleanup-cancelled-runs.yml'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  workflow_call:

permissions:
  actions: write
  contents: read

concurrency:
  group: cleanup-cancelled-workflow-runs
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete cancelled workflow runs only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t run_ids < <(
            gh api --paginate \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$GITHUB_REPOSITORY/actions/runs?status=cancelled&per_page=100" \
              --jq '.workflow_runs[] | select(.status == "completed" and .conclusion == "cancelled") | .id'
          )

          echo "CANCELLED_RUNS_FOUND=${#run_ids[@]}"
          for run_id in "${run_ids[@]}"; do
            test "$run_id" != "$GITHUB_RUN_ID"
            echo "Deleting cancelled workflow run $run_id"
            gh api --method DELETE \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$GITHUB_REPOSITORY/actions/runs/$run_id"
          done

          remaining="$(
            gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$GITHUB_REPOSITORY/actions/runs?status=cancelled&per_page=1" \
              --jq '.total_count'
          )"
          echo "CANCELLED_RUNS_REMAINING=$remaining"
          test "$remaining" = "0"
