name: Samuel Trusted PR Validation

run-name: >-
  Samuel Trusted PR Validation dispatch:${{
    inputs.samuel_validation_id ||
    github.event.workflow_run.id ||
    github.run_id
  }}

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      samuel_validation_id:
        description: Durable Samuel trusted-validation identity
        required: true
        type: string
      pr_number:
        description: Exact Samuel PR number
        required: true
        type: string
      head_sha:
        description: Exact PR head SHA to validate
        required: true
        type: string
      head_branch:
        description: Exact Samuel PR head branch
        required: true
        type: string

jobs:
  validate:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       startsWith(inputs.head_branch, 'samuel/')) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'action_required' &&
       github.event.workflow_run.actor.login == 'github-actions[bot]' &&
       startsWith(github.event.workflow_run.head_branch, 'samuel/'))
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VALIDATION_HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.event.workflow_run.head_sha }}
      VALIDATION_HEAD_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.head_branch || github.event.workflow_run.head_branch }}
      VALIDATION_PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || '' }}
    steps:
      - name: Verify dispatched PR identity
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$VALIDATION_PR_NUMBER" in
            ''|*[!0-9]*|0) echo "invalid PR number" >&2; exit 2 ;;
          esac
          case "$VALIDATION_HEAD_BRANCH" in
            samuel/*) ;;
            *) echo "trusted validation requires samuel/* head" >&2; exit 2 ;;
          esac
          test "${#VALIDATION_HEAD_SHA}" -eq 40
          gh api "repos/$GITHUB_REPOSITORY/pulls/$VALIDATION_PR_NUMBER" > trusted-pr.json
          python3 - <<'PY'
          import json, os
          pr=json.load(open("trusted-pr.json"))
          expected={
              "number":int(os.environ["VALIDATION_PR_NUMBER"]),
              "head_sha":os.environ["VALIDATION_HEAD_SHA"],
              "head_branch":os.environ["VALIDATION_HEAD_BRANCH"],
          }
          observed={
              "number":pr.get("number"),
              "head_sha":(pr.get("head") or {}).get("sha"),
              "head_branch":(pr.get("head") or {}).get("ref"),
              "base":(pr.get("base") or {}).get("ref"),
              "state":pr.get("state"),
              "actor":(pr.get("user") or {}).get("login"),
          }
          if observed["number"] != expected["number"]:
              raise SystemExit("trusted validation PR number changed")
          if observed["head_sha"] != expected["head_sha"]:
              raise SystemExit("trusted validation PR head SHA is stale")
          if observed["head_branch"] != expected["head_branch"]:
              raise SystemExit("trusted validation PR head branch changed")
          if observed["base"] != "main" or observed["state"] != "open":
              raise SystemExit("trusted validation PR is no longer open against main")
          if observed["actor"] != "github-actions[bot]":
              raise SystemExit("trusted validation dispatch is only for Samuel bot PRs")
          print("SAMUEL_TRUSTED_PR_IDENTITY=PASS")
          PY

      - name: Checkout exact Samuel PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.VALIDATION_HEAD_SHA }}
          fetch-depth: 1

      - name: Verify exact source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$VALIDATION_HEAD_SHA"

      - name: Compile Python surfaces
        run: |
          python3 -m compileall -q src tests tools
          python3 tools/validate_python_surfaces.py

      - name: Run tests
        env:
          PYTHONPATH: src
        run: |
          python3 -m unittest discover -s tests -v
          python3 tools/run_function_tests.py

      - name: Verify CLI surface
        env:
          PYTHONPATH: src
        run: |
          python3 -m chatgpt_operation.cli --help
          python3 -m chatgpt_operation.cli skills validate-contracts
          python3 -m chatgpt_operation.cli skills validate-capabilities
          python3 -m chatgpt_operation.cli controller self-test

  publish:
    if: >-
      always() &&
      (
        (github.event_name == 'workflow_dispatch' &&
         startsWith(inputs.head_branch, 'samuel/')) ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'action_required' &&
         github.event.workflow_run.actor.login == 'github-actions[bot]' &&
         startsWith(github.event.workflow_run.head_branch, 'samuel/'))
      )
    needs: validate
    permissions:
      actions: write
      statuses: write
      contents: read
    runs-on: ubuntu-24.04
    env:
      VALIDATION_HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.event.workflow_run.head_sha }}
    steps:
      - name: Publish trusted validation status
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: |
          set -euo pipefail
          state=failure
          description="Samuel trusted validation failed"
          if [ "$VALIDATION_RESULT" = "success" ]; then
            state=success
            description="Samuel trusted validation passed"
          fi
          gh api --method POST             "repos/$GITHUB_REPOSITORY/statuses/$VALIDATION_HEAD_SHA"             -f state="$state"             -f context="samuel/trusted-validation"             -f description="$description" >/dev/null

      - name: Wake Samuel Controller on trusted main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run samuel-bootstrap.yml             --repo "$GITHUB_REPOSITORY"             --ref main

      - name: Propagate validation failure
        if: ${{ needs.validate.result != 'success' }}
        run: exit 1
