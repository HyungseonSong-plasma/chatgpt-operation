name: One-shot Samuel feature branch cleanup

on:
  push:
    branches: [main]
    paths: [.github/workflows/cleanup-samuel-skill-first-once.yml]

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Delete merged Samuel feature branch with exact-SHA lease
        uses: ./.github/actions/branch-delete
        with:
          repository: HyungseonSong-plasma/chatgpt-operation
          branch: samuel/github-mutation-skill-first
          expected-sha: 005373891070b9c105b4884c01d05a4c4c61d81e
          github-token: ${{ github.token }}
