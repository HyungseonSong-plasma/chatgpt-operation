name: Samuel Repository Mutation
run-name: Samuel Repository Mutation dispatch:${{ inputs.samuel_dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      samuel_action_id:
        description: Durable Samuel ActionPlan identity
        required: true
        type: string
      samuel_dispatch_id:
        description: Durable Samuel physical dispatch identity
        required: true
        type: string
      plan_json:
        description: Typed repository_mutation ActionPlan JSON
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: samuel-repository-mutation
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact controller source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Materialize typed plan
        env:
          PLAN_JSON: ${{ inputs.plan_json }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          raw=json.loads(os.environ["PLAN_JSON"])
          pathlib.Path("samuel-action-plan.json").write_text(
              json.dumps(raw,indent=2,sort_keys=True)+"\n",encoding="utf-8"
          )
          PY

      - name: Execute bounded repository mutation
        id: execute
        env:
          PYTHONPATH: src
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          python3 -m chatgpt_operation.cli repository execute-plan \
            --input samuel-action-plan.json \
            --policy automation/samuel/repository-mutation-policy.json \
            --repository "$GITHUB_REPOSITORY" \
            --result samuel-execution-result.json
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Bind execution provenance
        if: always() && hashFiles('samuel-execution-result.json') != ''
        env:
          SAMUEL_ACTION_ID: ${{ inputs.samuel_action_id }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          path=pathlib.Path("samuel-execution-result.json")
          raw=json.loads(path.read_text(encoding="utf-8"))
          action_id=str(raw.get("action_id",""))
          expected=os.environ["SAMUEL_ACTION_ID"].strip()
          if not expected or action_id != expected:
              raise SystemExit("SAMUEL_REPOSITORY_MUTATION=HARD_STOP action identity mismatch")
          details=dict(raw.get("details") or {})
          details["provenance"]={
              "schema_version":1,
              "workflow_run_id":int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt":int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "head_sha":os.environ["GITHUB_SHA"],
              "action_id":action_id,
          }
          raw["details"]=details
          path.write_text(
              json.dumps(raw,sort_keys=True,separators=(",",":"))+"\n",
              encoding="utf-8",
          )
          PY

      - name: Upload typed execution result
        if: always() && hashFiles('samuel-execution-result.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: samuel-execution-result-${{ github.run_id }}
          path: samuel-execution-result.json
          if-no-files-found: error
          retention-days: 30

      - name: Wake Samuel controller after worker completion
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run samuel-bootstrap.yml --ref main
