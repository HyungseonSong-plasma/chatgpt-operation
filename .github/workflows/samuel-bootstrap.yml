name: Samuel Bootstrap

on:
  issues:
    types: [opened, reopened, labeled]
  issue_comment:
    types: [created]
  schedule:
    - cron: '9 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  actions: write
  issues: write

concurrency:
  group: samuel-bootstrap
  cancel-in-progress: false

jobs:
  wake:
    if: ${{ github.event_name != 'issue_comment' || contains(github.event.comment.body, '<!-- samuel-reasoning-submission -->') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Persist bootstrap heartbeat evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          marker='<!-- samuel-bootstrap-heartbeat -->'
          payload="$(python3 - <<'PY'
          import json, os
          print(json.dumps({
              "schema_version": 1,
              "event_name": os.environ["GITHUB_EVENT_NAME"],
              "event_action": os.environ.get("GITHUB_EVENT_ACTION", ""),
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "head_sha": os.environ["GITHUB_SHA"],
              "ref": os.environ["GITHUB_REF"],
          }, sort_keys=True, separators=(",", ":")))
          PY
          )"
          body="$marker
          \`\`\`json
          $payload
          \`\`\`"
          comments="$(gh api "repos/$GITHUB_REPOSITORY/issues/44/comments?per_page=100")"
          comment_id="$(python3 -c 'import json,sys; m="<!-- samuel-bootstrap-heartbeat -->"; xs=json.load(sys.stdin); ids=[x["id"] for x in xs if m in x.get("body","")]; assert len(ids)<=1; print(ids[0] if ids else "")' <<<"$comments")"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/44/comments" -f body="$body" >/dev/null
          fi
      - name: Build bounded semantic repository context
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" > samuel-open-issues.json
          gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" > samuel-open-prs.json
          python3 - <<'PY'
          import json, os, subprocess, sys
          sys.path.insert(0,"src")
          from chatgpt_operation.github.ci_state import synthesize_ci_state
          issues=[
              {
                  "number":item["number"],
                  "title":item["title"],
                  "body":item.get("body") or "",
                  "state":item["state"],
                  "labels":[x["name"] for x in item.get("labels",[])],
              }
              for item in json.load(open("samuel-open-issues.json"))
              if "pull_request" not in item
          ]
          refs=subprocess.run(
              ["git","ls-remote","--heads","origin","refs/heads/samuel/*"],
              check=False,capture_output=True,text=True,
          ).stdout.splitlines()
          branch_limit=200
          if len(refs)>branch_limit:
              raise SystemExit(
                  "SAMUEL_CONTEXT=HARD_STOP samuel branch inventory exceeds bound "
                  +str(branch_limit)
              )
          branches=[
              {"head_sha":line.split()[0],"ref":line.split()[1]}
              for line in refs if len(line.split())==2
          ]
          tracked=subprocess.run(
              ["git","ls-files"],
              check=True,capture_output=True,text=True,
          ).stdout.splitlines()
          prefixes=(
              ".github/workflows/",
              "src/chatgpt_operation/",
              "tests/",
              "automation/samuel/",
              "skills/",
          )
          relevant_tracked_paths=sorted(
              path for path in tracked
              if path.startswith(prefixes)
          )
          tracked_paths_truncated=len(relevant_tracked_paths)>500
          tracked_paths=relevant_tracked_paths[:500]
          workflow_files=[
              path for path in tracked_paths
              if path.startswith(".github/workflows/")
          ]
          pull_requests=[]
          for item in json.load(open("samuel-open-prs.json"))[:30]:
              head_sha=item["head"]["sha"]
              status=subprocess.run(
                  [
                      "gh","api",
                      "repos/"+os.environ["GITHUB_REPOSITORY"]
                      +"/commits/"+head_sha+"/status",
                  ],
                  check=False,capture_output=True,text=True,
              )
              checks=subprocess.run(
                  [
                      "gh","api",
                      "-H","Accept: application/vnd.github+json",
                      "repos/"+os.environ["GITHUB_REPOSITORY"]
                      +"/commits/"+head_sha+"/check-runs?per_page=100",
                  ],
                  check=False,capture_output=True,text=True,
              )
              status_payload=None
              checks_payload=None
              if status.returncode==0:
                  try:
                      status_payload=json.loads(status.stdout)
                  except json.JSONDecodeError:
                      pass
              if checks.returncode==0:
                  try:
                      checks_payload=json.loads(checks.stdout)
                  except json.JSONDecodeError:
                      pass
              ci_state=synthesize_ci_state(
                  status_payload,checks_payload
              )
              pull_requests.append({
                  "number":item["number"],
                  "title":item["title"],
                  "state":item["state"],
                  "draft":bool(item.get("draft")),
                  "head_ref":item["head"]["ref"],
                  "head_sha":head_sha,
                  "base_ref":item["base"]["ref"],
                  "ci_state":ci_state,
              })
          context={
              "schema_version":1,
              "repository":os.environ["GITHUB_REPOSITORY"],
              "observed_head_sha":os.environ["GITHUB_SHA"],
              "open_issues":issues,
              "open_pull_requests":pull_requests,
              "samuel_branches":branches,
              "tracked_paths":tracked_paths,
              "tracked_paths_truncated":tracked_paths_truncated,
              "workflow_files":workflow_files,
          }
          open("samuel-repository-context.json","w").write(
              json.dumps(context,sort_keys=True,separators=(",",":"))+"\n"
          )
          PY

      - name: Load durable controller state and select work
        env:
          PYTHONPATH: src
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SAMUEL_OPENAI_MODEL: gpt-5.6-luna
          SAMUEL_REASONING_MODE: AUTO_WITH_AUDIT
          ISSUE_JSON: ${{ github.event_name == 'issues' && toJSON(github.event.issue) || 'null' }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/issues/44/comments?per_page=100" > samuel-issue-comments.json
          python3 -m chatgpt_operation.cli controller run-cycle \
            --comments samuel-issue-comments.json \
            --pending automation/samuel/bootstrap.json \
            --decisions automation/samuel/decisions.json \
            --event-name "$GITHUB_EVENT_NAME" \
            --event-action "${GITHUB_EVENT_ACTION:-}" \
            --issue-json "${ISSUE_JSON:-null}" \
            --repository-context samuel-repository-context.json \
            --head-sha "$GITHUB_SHA" \
            --ref "$GITHUB_REF" \
            --executor-ref "${{ github.ref_name }}" \
            --executor-head-sha "${{ github.sha }}" \
            --result samuel-controller-cycle.json \
            --selected-work-result samuel-selected-work.json \
            --planning-result samuel-issue-planning.json \
            --admission-write-result samuel-cycle-admission-write.json \
            --state-write-result samuel-cycle-state-write.json \
            --execution-command-result samuel-execution-command.json

      - name: Persist controller cycle writes
        env:
          PYTHONPATH: src
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -f samuel-cycle-admission-write.json ]; then
            method="$(python3 -c 'import json; print(json.load(open("samuel-cycle-admission-write.json"))["method"])')"
            comment_id="$(python3 -c 'import json; x=json.load(open("samuel-cycle-admission-write.json"))["comment_id"]; print("" if x is None else x)')"
            body="$(python3 -c 'import json; print(json.load(open("samuel-cycle-admission-write.json"))["body"])')"
            if [ "$method" = "PATCH" ]; then
              test -n "$comment_id"
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -f body="$body" >/dev/null
            else
              test "$method" = "POST"
              test -z "$comment_id"
              gh api --method POST "repos/$GITHUB_REPOSITORY/issues/44/comments" -f body="$body" >/dev/null
            fi
          fi
          if [ -f samuel-cycle-state-write.json ]; then
            python3 -m chatgpt_operation.cli controller persist-state \
              --request samuel-cycle-state-write.json \
              --repository "$GITHUB_REPOSITORY" \
              --issue-number 44 \
              --token-env GH_TOKEN \
              --result samuel-cycle-state-persist-result.json
          fi

      - name: Persist guarded Issue planning evidence
        if: ${{ hashFiles('samuel-issue-planning.json') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          outcome="$(python3 -c 'import json; print(json.load(open("samuel-issue-planning.json"))["outcome"])')"
          work_id="$(python3 -c 'import json; print(json.load(open("samuel-issue-planning.json"))["work_id"])')"
          echo "SAMUEL_ISSUE_PLANNING=${outcome^^} work_id=$work_id"
          gh api "repos/$GITHUB_REPOSITORY/issues/44/comments?per_page=100" > samuel-planning-comments.json
          python3 - <<'PY'
          import json
          marker="<!-- samuel-issue-planning -->"
          planning=open(
              "samuel-issue-planning.json",encoding="utf-8"
          ).read().strip()
          body=marker+"\n~~~json\n"+planning+"\n~~~"
          comments=json.load(open("samuel-planning-comments.json"))
          ids=[
              item["id"] for item in comments
              if marker in str(item.get("body",""))
          ]
          if len(ids)>1:
              raise SystemExit(
                  "SAMUEL_ISSUE_PLANNING=HARD_STOP multiple audit comments"
              )
          json.dump(
              {"body":body},
              open("samuel-planning-comment-payload.json","w"),
          )
          open("samuel-planning-comment-id.txt","w").write(
              "" if not ids else str(ids[0])
          )
          PY
          comment_id="$(cat samuel-planning-comment-id.txt)"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" \
              --input samuel-planning-comment-payload.json >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/44/comments" \
              --input samuel-planning-comment-payload.json >/dev/null
          fi

      - name: Execute root-issued controller command
        env:
          PYTHONPATH: src
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -f samuel-execution-command.json ]; then
            echo "SAMUEL_BOOTSTRAP=IDLE"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/issues/44/comments?per_page=100" > samuel-execution-comments.json
          python3 -m chatgpt_operation.cli controller execute-command \
            --command samuel-execution-command.json \
            --comments samuel-execution-comments.json \
            --repository "$GITHUB_REPOSITORY" \
            --result samuel-execution-gateway-result.json \
            --state-write-result samuel-gateway-state-write.json \
            --action-run-id-result samuel-action-run-id.txt \
            --evidence-run-id-result samuel-evidence-run-id.txt \
            --diagnostic-run-id-result samuel-diagnostic-run-id.txt \
            --corrective-run-id-result samuel-corrective-run-id.txt \
            --action-terminal-observation-result samuel-action-terminal-observation.json

      - name: Persist execution gateway state write
        if: ${{ hashFiles('samuel-gateway-state-write.json') != '' }}
        env:
          PYTHONPATH: src
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m chatgpt_operation.cli controller persist-state \
            --request samuel-gateway-state-write.json \
            --repository "$GITHUB_REPOSITORY" \
            --issue-number 44 \
            --token-env GH_TOKEN \
            --result samuel-gateway-state-persist-result.json

      - name: Materialize dispatched worker run identity
        if: ${{ hashFiles('samuel-execution-gateway-result.json') != '' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          raw=json.load(open("samuel-execution-gateway-result.json"))
          if raw.get("status") != "receipt":
              print(
                  "SAMUEL_WORKER_ID=NOT_REQUIRED status="
                  +str(raw.get("status") or "")
              )
              raise SystemExit(0)
          surface=raw.get("surface")
          outputs={
              "action":"samuel-action-run-id.txt",
              "evidence":"samuel-evidence-run-id.txt",
              "diagnostic":"samuel-diagnostic-run-id.txt",
              "corrective":"samuel-corrective-run-id.txt",
          }
          if surface=="trusted_validation":
              print(
                  "SAMUEL_WORKER_ID=NOT_REQUIRED surface=trusted_validation "
                  "validation workflow publishes exact-head status and wakes controller"
              )
              raise SystemExit(0)
          output=outputs.get(surface)
          if output is None:
              raise SystemExit(
                  "SAMUEL_WORKER_ID=HARD_STOP unsupported receipt surface"
              )
          receipt=raw.get("receipt")
          if not isinstance(receipt,dict):
              raise SystemExit("SAMUEL_WORKER_ID=HARD_STOP receipt missing")
          run_id=receipt.get("workflow_run_id")
          if not isinstance(run_id,int) or isinstance(run_id,bool) or run_id < 1:
              raise SystemExit("SAMUEL_WORKER_ID=HARD_STOP invalid workflow_run_id")
          existing=[
              path for path in outputs.values()
              if Path(path).exists()
          ]
          if existing:
              if existing != [output]:
                  raise SystemExit(
                      "SAMUEL_WORKER_ID=HARD_STOP conflicting run-id surface"
                  )
              current=Path(output).read_text(encoding="utf-8").strip()
              if current != str(run_id):
                  raise SystemExit(
                      "SAMUEL_WORKER_ID=HARD_STOP conflicting run identity"
                  )
          else:
              Path(output).write_text(str(run_id)+"\n",encoding="utf-8")
          print(
              f"SAMUEL_WORKER_ID=MATERIALIZED surface={surface} run_id={run_id}"
          )
          PY

      - name: Wait for dispatched bounded worker terminal state
        if: ${{ hashFiles('samuel-action-run-id.txt') != '' || hashFiles('samuel-evidence-run-id.txt') != '' || hashFiles('samuel-diagnostic-run-id.txt') != '' || hashFiles('samuel-corrective-run-id.txt') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count=0
          run_file=""
          for candidate in \
            samuel-action-run-id.txt \
            samuel-evidence-run-id.txt \
            samuel-diagnostic-run-id.txt \
            samuel-corrective-run-id.txt
          do
            if [ -f "$candidate" ]; then
              count=$((count+1))
              run_file="$candidate"
            fi
          done
          if [ "$count" -ne 1 ]; then
            echo "SAMUEL_WORKER_WAIT=HARD_STOP expected exactly one worker run id, found $count" >&2
            exit 2
          fi
          run_id="$(cat "$run_file")"
          deadline=$((SECONDS+360))
          while true; do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > samuel-worker-run.json
            status="$(python3 -c 'import json; print(json.load(open("samuel-worker-run.json"))["status"])')"
            if [ "$status" = "completed" ]; then
              conclusion="$(python3 -c 'import json; print(json.load(open("samuel-worker-run.json")).get("conclusion") or "")')"
              echo "SAMUEL_WORKER_WAIT=TERMINAL run_id=$run_id conclusion=$conclusion"
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "SAMUEL_WORKER_WAIT=HARD_STOP timeout run_id=$run_id status=$status" >&2
              exit 2
            fi
            sleep 5
          done

      - name: Observe completed bounded worker through composition root
        if: ${{ hashFiles('samuel-action-run-id.txt') != '' || hashFiles('samuel-evidence-run-id.txt') != '' || hashFiles('samuel-diagnostic-run-id.txt') != '' || hashFiles('samuel-corrective-run-id.txt') != '' }}
        env:
          PYTHONPATH: src
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_status="$(
            python3 -c 'import json; print(json.load(open("samuel-execution-gateway-result.json")).get("status",""))'
          )"
          if [ "$current_status" = "terminal" ]; then
            echo "SAMUEL_POST_WORKER=ALREADY_TERMINAL"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/issues/44/comments?per_page=100" > samuel-post-worker-comments.json
          python3 -m chatgpt_operation.cli controller run-cycle \
            --comments samuel-post-worker-comments.json \
            --pending automation/samuel/bootstrap.json \
            --decisions automation/samuel/decisions.json \
            --event-name bootstrap \
            --event-action terminal-observation \
            --issue-json null \
            --repository-context samuel-repository-context.json \
            --head-sha "$GITHUB_SHA" \
            --ref "$GITHUB_REF" \
            --executor-ref "${{ github.ref_name }}" \
            --executor-head-sha "${{ github.sha }}" \
            --result samuel-post-worker-cycle.json \
            --selected-work-result samuel-post-worker-selected.json \
            --planning-result samuel-post-worker-planning.json \
            --admission-write-result samuel-post-worker-admission-write.json \
            --state-write-result samuel-post-worker-state-write.json \
            --execution-command-result samuel-post-worker-command.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          selected=json.load(open("samuel-post-worker-selected.json"))
          kind=str(selected.get("kind") or "")
          if kind not in {
              "action_observation",
              "evidence_observation",
              "diagnostic_observation",
              "corrective_observation",
          }:
              raise SystemExit(
                  "SAMUEL_POST_WORKER=HARD_STOP expected observation work, got "+kind
              )
          for forbidden in (
              "samuel-post-worker-planning.json",
              "samuel-post-worker-admission-write.json",
              "samuel-post-worker-state-write.json",
          ):
              if Path(forbidden).exists():
                  raise SystemExit(
                      "SAMUEL_POST_WORKER=HARD_STOP observation cycle emitted unexpected write"
                  )
          if not Path("samuel-post-worker-command.json").exists():
              raise SystemExit(
                  "SAMUEL_POST_WORKER=HARD_STOP observation command missing"
              )
          print("SAMUEL_POST_WORKER=OBSERVATION_COMMAND kind="+kind)
          PY
          python3 -m chatgpt_operation.cli controller execute-command \
            --command samuel-post-worker-command.json \
            --comments samuel-post-worker-comments.json \
            --repository "$GITHUB_REPOSITORY" \
            --token-env GH_TOKEN \
            --result samuel-execution-gateway-result.json \
            --state-write-result samuel-post-worker-gateway-state-write.json \
            --action-run-id-result samuel-action-run-id.txt \
            --evidence-run-id-result samuel-evidence-run-id.txt \
            --diagnostic-run-id-result samuel-diagnostic-run-id.txt \
            --corrective-run-id-result samuel-corrective-run-id.txt \
            --action-terminal-observation-result samuel-action-terminal-observation.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          result=json.load(open("samuel-execution-gateway-result.json"))
          if result.get("status") != "terminal":
              raise SystemExit(
                  "SAMUEL_POST_WORKER=HARD_STOP gateway did not confirm terminal state"
              )
          if Path("samuel-post-worker-gateway-state-write.json").exists():
              raise SystemExit(
                  "SAMUEL_POST_WORKER=HARD_STOP terminal observation attempted state mutation"
              )
          print(
              "SAMUEL_POST_WORKER=TERMINAL surface="
              +str(result.get("surface") or "")
              +" run_id="+str(result.get("terminal_run_id") or "")
          )
          PY

      - name: Persist terminal controller artifact
        if: ${{ hashFiles('samuel-action-run-id.txt') != '' || hashFiles('samuel-evidence-run-id.txt') != '' || hashFiles('samuel-diagnostic-run-id.txt') != '' || hashFiles('samuel-corrective-run-id.txt') != '' }}
        env:
          PYTHONPATH: src
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count=0
          surface=""
          run_file=""
          if [ -f samuel-action-run-id.txt ]; then
            count=$((count+1)); surface="action"; run_file="samuel-action-run-id.txt"
          fi
          if [ -f samuel-evidence-run-id.txt ]; then
            count=$((count+1)); surface="evidence"; run_file="samuel-evidence-run-id.txt"
          fi
          if [ -f samuel-diagnostic-run-id.txt ]; then
            count=$((count+1)); surface="diagnostic"; run_file="samuel-diagnostic-run-id.txt"
          fi
          if [ -f samuel-corrective-run-id.txt ]; then
            count=$((count+1)); surface="corrective"; run_file="samuel-corrective-run-id.txt"
          fi
          if [ "$count" -ne 1 ]; then
            echo "SAMUEL_TERMINAL=HARD_STOP expected exactly one terminal surface, found $count" >&2
            exit 2
          fi
          run_id="$(cat "$run_file")"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" > terminal-artifacts.json
          export SAMUEL_TERMINAL_SURFACE="$surface"
          artifact_id="$(
          python3 - <<'PY'
          import json, os
          surface=os.environ["SAMUEL_TERMINAL_SURFACE"]
          items=json.load(open("terminal-artifacts.json"))["artifacts"]
          def match(item):
              if item.get("expired"):
                  return False
              name=str(item.get("name",""))
              if surface in {"action","corrective"}:
                  return name.startswith("samuel-execution-result-")
              if surface=="evidence":
                  return name=="samuel-evidence-result"
              return name=="samuel-diagnostic-result"
          matches=[item for item in items if match(item)]
          if surface=="action" and len(matches)==0:
              print("__MISSING_ACTION_ARTIFACT__")
          elif len(matches)!=1:
              raise SystemExit(
                  f"SAMUEL_TERMINAL=HARD_STOP expected one {surface} artifact, "
                  f"found {len(matches)}"
              )
          else:
              print(matches[0]["id"])
          PY
          )"
          rm -rf terminal-result && mkdir terminal-result
          if [ "$artifact_id" = "__MISSING_ACTION_ARTIFACT__" ]; then
            printf '%s\n' '__SAMUEL_MISSING_ACTION_ARTIFACT__' > terminal-result/samuel-execution-result.json
          else
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" -o terminal.zip
            unzip -q terminal.zip -d terminal-result
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path
          surface=os.environ["SAMUEL_TERMINAL_SURFACE"]
          expected={
              "action":"samuel-execution-result.json",
              "corrective":"samuel-execution-result.json",
              "evidence":"samuel-evidence-result.json",
              "diagnostic":"samuel-diagnostic-result.json",
          }[surface]
          matches=[p for p in Path("terminal-result").rglob("*") if p.is_file() and p.name==expected]
          if len(matches)!=1:
              raise SystemExit(
                  f"SAMUEL_TERMINAL=HARD_STOP expected one {expected}, found {len(matches)}"
              )
          Path("samuel-terminal-artifact-path.txt").write_text(
              str(matches[0]),encoding="utf-8"
          )
          PY
          gh api "repos/$GITHUB_REPOSITORY/issues/44/comments?per_page=100" > terminal-comments.json
          artifact_path="$(cat samuel-terminal-artifact-path.txt)"
          python3 -m chatgpt_operation.cli controller ingest-terminal \
            --surface "$surface" \
            --run-id "$run_id" \
            --artifact "$artifact_path" \
            --gateway-result samuel-execution-gateway-result.json \
            --comments terminal-comments.json \
            --result samuel-terminal-ingestion-result.json \
            --state-write-result samuel-terminal-state-write.json
          if [ ! -f samuel-terminal-state-write.json ]; then
            echo "SAMUEL_TERMINAL=NO_STATE_CHANGE"
            exit 0
          fi
          python3 -m chatgpt_operation.cli controller persist-state \
            --request samuel-terminal-state-write.json \
            --repository "$GITHUB_REPOSITORY" \
            --issue-number 44 \
            --token-env GH_TOKEN \
            --result samuel-terminal-state-persist-result.json
          python3 - <<'PY'
          import json
          result=json.load(open("samuel-terminal-ingestion-result.json"))
          persisted=json.load(open("samuel-terminal-state-persist-result.json"))
          print(
              "SAMUEL_TERMINAL=PERSISTED surface="+result["surface"]
              +" action_id="+result["action_id"]
              +" outcome="+result["outcome"]
              +" revision="+str(persisted["revision"])
          )
          PY
      - name: Continue Samuel closed loop after terminal persistence
        if: ${{ hashFiles('samuel-terminal-state-persist-result.json') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run samuel-bootstrap.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main
