name: Samuel Trusted PR Validation

run-name: >-
  Samuel Trusted PR Validation dispatch:${{
    inputs.samuel_validation_id ||
    github.event.workflow_run.id ||
    github.run_id
  }}

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      samuel_validation_id:
        description: Durable Samuel trusted-validation identity
        required: true
        type: string
      pr_number:
        description: Exact Samuel PR number
        required: true
        type: string
      head_sha:
        description: Exact PR head SHA to validate
        required: true
        type: string
      head_branch:
        description: Exact Samuel PR head branch
        required: true
        type: string

jobs:
  validate:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       startsWith(inputs.head_branch, 'samuel/')) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'action_required' &&
       github.event.workflow_run.actor.login == 'github-actions[bot]' &&
       startsWith(github.event.workflow_run.head_branch, 'samuel/'))
    permissions:
      actions: read
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VALIDATION_HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.event.workflow_run.head_sha }}
      VALIDATION_HEAD_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.head_branch || github.event.workflow_run.head_branch }}
      VALIDATION_PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || '' }}
    steps:
      - name: Verify dispatched PR identity
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$VALIDATION_PR_NUMBER" in
            ''|*[!0-9]*|0) echo "invalid PR number" >&2; exit 2 ;;
          esac
          case "$VALIDATION_HEAD_BRANCH" in
            samuel/*) ;;
            *) echo "trusted validation requires samuel/* head" >&2; exit 2 ;;
          esac
          test "${#VALIDATION_HEAD_SHA}" -eq 40
          gh api "repos/$GITHUB_REPOSITORY/pulls/$VALIDATION_PR_NUMBER" > trusted-pr.json
          gh api "repos/$GITHUB_REPOSITORY/pulls/$VALIDATION_PR_NUMBER/files?per_page=100" > trusted-pr-files.json
          python3 - <<'PY'
          import json, os
          pr=json.load(open("trusted-pr.json"))
          files=json.load(open("trusted-pr-files.json"))
          expected={
              "number":int(os.environ["VALIDATION_PR_NUMBER"]),
              "head_sha":os.environ["VALIDATION_HEAD_SHA"],
              "head_branch":os.environ["VALIDATION_HEAD_BRANCH"],
          }
          observed={
              "number":pr.get("number"),
              "head_sha":(pr.get("head") or {}).get("sha"),
              "head_branch":(pr.get("head") or {}).get("ref"),
              "base":(pr.get("base") or {}).get("ref"),
              "state":pr.get("state"),
              "actor":(pr.get("user") or {}).get("login"),
          }
          if observed["number"] != expected["number"]:
              raise SystemExit("trusted validation PR number changed")
          if observed["head_sha"] != expected["head_sha"]:
              raise SystemExit("trusted validation PR head SHA is stale")
          if observed["head_branch"] != expected["head_branch"]:
              raise SystemExit("trusted validation PR head branch changed")
          if observed["base"] != "main" or observed["state"] != "open":
              raise SystemExit("trusted validation PR is no longer open against main")
          if observed["actor"] != "github-actions[bot]":
              raise SystemExit("trusted validation dispatch is only for Samuel bot PRs")
          if pr.get("changed_files") != len(files):
              raise SystemExit("trusted validation PR changed-file set is truncated")
          workflow_changes=[
              item.get("filename")
              for item in files
              if str(item.get("filename") or "").startswith(".github/workflows/")
          ]
          if workflow_changes:
              raise SystemExit(
                  "trusted validation fallback cannot validate workflow mutations: "
                  + ",".join(str(item) for item in workflow_changes)
              )
          print("SAMUEL_TRUSTED_PR_IDENTITY=PASS")
          PY

      - name: Verify ordinary CI fallback boundary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=pull_request&per_page=100" > ordinary-ci-runs.json
            python3 - <<'PY' > ordinary-ci-route.txt
          import json, os
          runs=json.load(open("ordinary-ci-runs.json")).get("workflow_runs",[])
          matches=[
              item for item in runs
              if item.get("head_sha")==os.environ["VALIDATION_HEAD_SHA"]
              and item.get("head_branch")==os.environ["VALIDATION_HEAD_BRANCH"]
          ]
          if not matches:
              print("NONE NONE NONE NONE")
          else:
              run=max(matches,key=lambda item:int(item.get("id",0)))
              print(
                  run.get("id"),
                  run.get("status"),
                  run.get("conclusion") or "NONE",
                  (run.get("actor") or {}).get("login") or "NONE",
              )
          PY
            read -r run_id run_status run_conclusion run_actor < ordinary-ci-route.txt
            if [ "$run_id" = "NONE" ] || [ "$run_status" != "completed" ]; then
              sleep 5
              continue
            fi
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" > ordinary-ci-jobs.json
            CI_RUN_ID="$run_id" CI_RUN_CONCLUSION="$run_conclusion" CI_RUN_ACTOR="$run_actor" python3 - <<'PY'
          import json, os
          jobs=json.load(open("ordinary-ci-jobs.json")).get("jobs",[])
          conclusion=os.environ["CI_RUN_CONCLUSION"]
          actor=os.environ["CI_RUN_ACTOR"]
          run_id=os.environ["CI_RUN_ID"]
          if conclusion=="success":
              if not jobs:
                  raise SystemExit(
                      f"ordinary CI run {run_id} reported success without jobs"
                  )
              print("SAMUEL_ORDINARY_CI_ROUTE=SUCCESS")
          elif (
              conclusion in {"action_required","failure"}
              and not jobs
              and actor=="github-actions[bot]"
          ):
              print("SAMUEL_ORDINARY_CI_ROUTE=BLOCKED_NO_JOBS")
          else:
              raise SystemExit(
                  f"ordinary CI is not eligible for trusted fallback: "
                  f"run={run_id} conclusion={conclusion} jobs={len(jobs)} actor={actor}"
              )
          PY
            exit 0
          done
          echo "ordinary CI route did not reach an exact-head terminal state" >&2
          exit 1

      - name: Checkout exact Samuel PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.VALIDATION_HEAD_SHA }}
          fetch-depth: 1

      - name: Verify exact source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$VALIDATION_HEAD_SHA"

      - name: Compile Python surfaces
        run: |
          python3 -m compileall -q src tests tools
          python3 tools/validate_python_surfaces.py

      - name: Run tests
        env:
          PYTHONPATH: src
        run: |
          python3 -m unittest discover -s tests -v
          python3 tools/run_function_tests.py

      - name: Verify CLI surface
        env:
          PYTHONPATH: src
        run: |
          python3 -m chatgpt_operation.cli --help
          python3 -m chatgpt_operation.cli skills validate-contracts
          python3 -m chatgpt_operation.cli skills validate-capabilities
          python3 -m chatgpt_operation.cli controller self-test

  publish:
    if: >-
      always() &&
      (
        (github.event_name == 'workflow_dispatch' &&
         startsWith(inputs.head_branch, 'samuel/')) ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'action_required' &&
         github.event.workflow_run.actor.login == 'github-actions[bot]' &&
         startsWith(github.event.workflow_run.head_branch, 'samuel/'))
      )
    needs: validate
    permissions:
      actions: write
      statuses: write
      contents: read
    runs-on: ubuntu-24.04
    env:
      VALIDATION_HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.event.workflow_run.head_sha }}
    steps:
      - name: Publish trusted validation status
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: |
          set -euo pipefail
          state=failure
          description="Samuel trusted validation failed"
          if [ "$VALIDATION_RESULT" = "success" ]; then
            state=success
            description="Samuel trusted validation passed"
          fi
          gh api --method POST             "repos/$GITHUB_REPOSITORY/statuses/$VALIDATION_HEAD_SHA"             -f state="$state"             -f context="samuel/trusted-validation"             -f description="$description" >/dev/null

      - name: Wake Samuel Controller on trusted main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run samuel-bootstrap.yml             --repo "$GITHUB_REPOSITORY"             --ref main

      - name: Propagate validation failure
        if: ${{ needs.validate.result != 'success' }}
        run: exit 1
