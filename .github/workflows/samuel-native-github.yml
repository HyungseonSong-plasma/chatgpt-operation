name: Samuel Native GitHub Executor
run-name: Samuel Native GitHub Executor dispatch:${{ inputs.samuel_dispatch_id != '' && inputs.samuel_dispatch_id || inputs.samuel_action_id }}

on:
  workflow_dispatch:
    inputs:
      samuel_action_id:
        description: Durable Samuel ActionPlan identity for causal run recovery
        required: false
        default: ""
        type: string
      samuel_dispatch_id:
        description: Durable Samuel physical dispatch identity
        required: false
        default: ""
        type: string
      plan_json:
        description: Typed Samuel ActionPlan JSON
        required: true
        type: string
      recovery_state:
        description: Optional encoded durable controller state
        required: false
        type: string
      recovery_authorization:
        description: Optional typed recovery authorization JSON
        required: false
        type: string

permissions:
  contents: write
  checks: read
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: samuel-native-github-executor
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact controller source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Materialize typed plan
        env:
          PLAN_JSON: ${{ inputs.plan_json }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          raw=json.loads(os.environ["PLAN_JSON"])
          pathlib.Path("samuel-action-plan.json").write_text(
              json.dumps(raw,indent=2,sort_keys=True)+"\n",encoding="utf-8"
          )
          PY

      - name: Materialize recovery authorization
        if: ${{ inputs.recovery_state != '' || inputs.recovery_authorization != '' }}
        env:
          RECOVERY_STATE: ${{ inputs.recovery_state }}
          RECOVERY_AUTHORIZATION: ${{ inputs.recovery_authorization }}
        run: |
          test -n "$RECOVERY_STATE" && test -n "$RECOVERY_AUTHORIZATION"
          printf '%s' "$RECOVERY_STATE" > samuel-recovery-state.txt
          printf '%s' "$RECOVERY_AUTHORIZATION" > samuel-recovery-authorization.json

      - name: Execute bounded GitHub mutation
        env:
          PYTHONPATH: src
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          args=()
          if test -f samuel-recovery-state.txt; then
            args+=(--recovery-state samuel-recovery-state.txt --recovery-authorization samuel-recovery-authorization.json)
          fi
          python3 -m chatgpt_operation.cli github execute-native \
            --input samuel-action-plan.json \
            --result samuel-execution-result.json \
            "${args[@]}"

      - name: Bind execution provenance
        if: always() && hashFiles('samuel-execution-result.json') != ''
        env:
          SAMUEL_ACTION_ID: ${{ inputs.samuel_action_id }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          path=pathlib.Path("samuel-execution-result.json")
          raw=json.loads(path.read_text(encoding="utf-8"))
          action_id=str(raw.get("action_id",""))
          expected=os.environ.get("SAMUEL_ACTION_ID","").strip()
          if expected and action_id != expected:
              raise SystemExit("SAMUEL_EXECUTION=HARD_STOP action identity mismatch")
          details=dict(raw.get("details") or {})
          details["provenance"]={
              "schema_version":1,
              "workflow_run_id":int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt":int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "head_sha":os.environ["GITHUB_SHA"],
              "action_id":action_id,
          }
          raw["details"]=details
          path.write_text(json.dumps(raw,sort_keys=True,separators=(",",":"))+"\n",encoding="utf-8")
          PY
      - name: Upload typed execution result
        if: always() && hashFiles('samuel-execution-result.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: samuel-execution-result-${{ github.run_id }}
          path: samuel-execution-result.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish result to job summary
        if: always()
        run: |
          if test -f samuel-execution-result.json; then
            echo '## Samuel ExecutionResult' >> "$GITHUB_STEP_SUMMARY"
            echo '~~~json' >> "$GITHUB_STEP_SUMMARY"
            cat samuel-execution-result.json >> "$GITHUB_STEP_SUMMARY"
            echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Wake Samuel controller after worker completion
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run samuel-bootstrap.yml --ref main
