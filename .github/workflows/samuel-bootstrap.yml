name: Samuel Bootstrap

on:
  issues:
    types: [opened, reopened, labeled]
  pull_request:
    types: [opened, reopened, synchronize, closed]
  issue_comment:
    types: [created]
  schedule:
    - cron: '55 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: samuel-bootstrap
  cancel-in-progress: false

jobs:
  wake:
    if: ${{ github.event_name != 'issue_comment' || contains(github.event.comment.body, '<!-- samuel-reasoning-submission -->') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Persist bootstrap heartbeat evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          marker='<!-- samuel-bootstrap-heartbeat -->'
          payload="$(python3 - <<'PY'
          import json, os
          print(json.dumps({
              "schema_version": 1,
              "event_name": os.environ["GITHUB_EVENT_NAME"],
              "event_action": os.environ.get("GITHUB_EVENT_ACTION", ""),
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "head_sha": os.environ["GITHUB_SHA"],
              "ref": os.environ["GITHUB_REF"],
          }, sort_keys=True, separators=(",", ":")))
          PY
          )"
          body="$marker
          \`\`\`json
          $payload
          \`\`\`"
          comments="$(gh api "repos/$GITHUB_REPOSITORY/issues/44/comments?per_page=100")"
          comment_id="$(python3 -c 'import json,sys; m="<!-- samuel-bootstrap-heartbeat -->"; xs=json.load(sys.stdin); ids=[x["id"] for x in xs if m in x.get("body","")]; assert len(ids)<=1; print(ids[0] if ids else "")' <<<"$comments")"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/44/comments" -f body="$body" >/dev/null
          fi
      - name: Admit explicitly labeled issue work
        if: ${{ github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'samuel') }}
        env:
          PYTHONPATH: src
          GH_TOKEN: ${{ github.token }}
          ISSUE_JSON: ${{ toJSON(github.event.issue) }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/issues/44/comments?per_page=100" > admission-comments.json
          python3 - <<'PY'
          import json, os
          from chatgpt_operation.controller.issue_ingestion import admit_issue
          comments=json.load(open("admission-comments.json"))
          issue=json.loads(os.environ["ISSUE_JSON"])
          write=admit_issue(comments,issue)
          open("samuel-admission-body.txt","w").write(write["body"])
          open("samuel-admission-comment-id.txt","w").write(
              "" if write["comment_id"] is None else str(write["comment_id"])
          )
          print("SAMUEL_ADMISSION="+("NEW" if write["changed"] else "NOOP")+" work_id="+write["work_id"])
          PY
          body="$(cat samuel-admission-body.txt)"
          comment_id="$(cat samuel-admission-comment-id.txt)"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/44/comments" -f body="$body" >/dev/null
          fi

      - name: Load durable controller state and select work
        env:
          PYTHONPATH: src
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/issues/44/comments?per_page=100" > samuel-issue-comments.json
          python3 -m chatgpt_operation.cli controller run-cycle \
            --comments samuel-issue-comments.json \
            --pending automation/samuel/bootstrap.json \
            --decisions automation/samuel/decisions.json \
            --event-name "$GITHUB_EVENT_NAME" \
            --event-action "${GITHUB_EVENT_ACTION:-}" \
            --head-sha "$GITHUB_SHA" \
            --ref "$GITHUB_REF" \
            --executor-ref "${{ github.event.pull_request.head.ref || github.ref_name }}" \
            --executor-head-sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            --result samuel-controller-cycle.json \
            --selected-work-result samuel-selected-work.json \
            --planning-result samuel-issue-planning.json \
            --admission-write-result samuel-cycle-admission-write.json \
            --state-write-result samuel-cycle-state-write.json \
            --execution-command-result samuel-execution-command.json

      - name: Persist controller cycle writes
        env:
          PYTHONPATH: src
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -f samuel-cycle-admission-write.json ]; then
            comment_id="$(python3 -c 'import json; print(json.load(open("samuel-cycle-admission-write.json"))["comment_id"])')"
            body="$(python3 -c 'import json; print(json.load(open("samuel-cycle-admission-write.json"))["body"])')"
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -f body="$body" >/dev/null
          fi
          if [ -f samuel-cycle-state-write.json ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/44/comments?per_page=100" > cycle-state-prewrite-comments.json
            python3 - <<'PY'
          import json
          from chatgpt_operation.controller.durable_state import validate_state_write_precondition
          validate_state_write_precondition(
              json.load(open("cycle-state-prewrite-comments.json")),
              json.load(open("samuel-cycle-state-write.json")),
          )
          PY
            method="$(python3 -c 'import json; print(json.load(open("samuel-cycle-state-write.json"))["method"])')"
            comment_id="$(python3 -c 'import json; x=json.load(open("samuel-cycle-state-write.json"))["comment_id"]; print("" if x is None else x)')"
            body="$(python3 -c 'import json; print(json.load(open("samuel-cycle-state-write.json"))["body"])')"
            if [ "$method" = "PATCH" ]; then
              test -n "$comment_id"
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -f body="$body" >/dev/null
            else
              gh api --method POST "repos/$GITHUB_REPOSITORY/issues/44/comments" -f body="$body" >/dev/null
            fi
            gh api "repos/$GITHUB_REPOSITORY/issues/44/comments?per_page=100" > cycle-state-readback-comments.json
            python3 - <<'PY'
          import json
          from chatgpt_operation.controller.durable_state import decode_state, STATE_MARKER
          request=json.load(open("samuel-cycle-state-write.json"))
          comments=json.load(open("cycle-state-readback-comments.json"))
          matches=[c for c in comments if STATE_MARKER in str(c.get("body",""))]
          if len(matches)!=1:
              raise SystemExit(
                  "SAMUEL_STATE=HARD_STOP expected one durable state, found "
                  +str(len(matches))
              )
          persisted=decode_state(str(matches[0]["body"]))
          if (
              persisted.research_id != request["research_id"]
              or persisted.revision != request["expected_revision"]
          ):
              raise SystemExit(
                  "SAMUEL_STATE=HARD_STOP readback mismatch "
                  f"research_id={persisted.research_id} revision={persisted.revision}"
              )
          print(
              f"SAMUEL_STATE=PERSISTED research_id={persisted.research_id} "
              f"revision={persisted.revision}"
          )
          PY
          fi

      - name: Persist guarded Issue planning evidence
        if: ${{ hashFiles('samuel-issue-planning.json') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          outcome="$(python3 -c 'import json; print(json.load(open("samuel-issue-planning.json"))["outcome"])')"
          work_id="$(python3 -c 'import json; print(json.load(open("samuel-issue-planning.json"))["work_id"])')"
          echo "SAMUEL_ISSUE_PLANNING=${outcome^^} work_id=$work_id"
          marker='<!-- samuel-issue-planning -->'
          body="$marker
          ~~~json
          $(cat samuel-issue-planning.json)
          ~~~"
          comments="$(gh api "repos/$GITHUB_REPOSITORY/issues/44/comments?per_page=100")"
          comment_id="$(python3 -c 'import json,sys; m="<!-- samuel-issue-planning -->"; xs=json.load(sys.stdin); ids=[x["id"] for x in xs if m in x.get("body","")]; assert len(ids)<=1; print(ids[0] if ids else "")' <<<"$comments")"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/44/comments" -f body="$body" >/dev/null
          fi

      - name: Execute root-issued controller command
        env:
          PYTHONPATH: src
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -f samuel-execution-command.json ]; then
            echo "SAMUEL_BOOTSTRAP=IDLE"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/issues/44/comments?per_page=100" > samuel-execution-comments.json
          python3 -m chatgpt_operation.cli controller execute-command \
            --command samuel-execution-command.json \
            --comments samuel-execution-comments.json \
            --repository "$GITHUB_REPOSITORY" \
            --result samuel-execution-gateway-result.json \
            --state-write-result samuel-gateway-state-write.json \
            --action-run-id-result samuel-action-run-id.txt \
            --evidence-run-id-result samuel-evidence-run-id.txt \
            --diagnostic-run-id-result samuel-diagnostic-run-id.txt \
            --action-terminal-observation-result samuel-action-terminal-observation.json

      - name: Persist execution gateway state write
        if: ${{ hashFiles('samuel-gateway-state-write.json') != '' }}
        env:
          PYTHONPATH: src
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/issues/44/comments?per_page=100" > gateway-state-prewrite-comments.json
          python3 - <<'PY'
          import json
          from chatgpt_operation.controller.durable_state import validate_state_write_precondition
          validate_state_write_precondition(
              json.load(open("gateway-state-prewrite-comments.json")),
              json.load(open("samuel-gateway-state-write.json")),
          )
          PY
          method="$(python3 -c 'import json; print(json.load(open("samuel-gateway-state-write.json"))["method"])')"
          comment_id="$(python3 -c 'import json; x=json.load(open("samuel-gateway-state-write.json"))["comment_id"]; print("" if x is None else x)')"
          body="$(python3 -c 'import json; print(json.load(open("samuel-gateway-state-write.json"))["body"])')"
          if [ "$method" = "PATCH" ]; then
            test -n "$comment_id"
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/44/comments" -f body="$body" >/dev/null
          fi
          gh api "repos/$GITHUB_REPOSITORY/issues/44/comments?per_page=100" > gateway-state-readback-comments.json
          python3 - <<'PY'
          import json
          from chatgpt_operation.controller.durable_state import load_state_comment
          request=json.load(open("samuel-gateway-state-write.json"))
          persisted=load_state_comment(json.load(open("gateway-state-readback-comments.json")))
          if (
              persisted is None
              or persisted.research_id != request["research_id"]
              or persisted.revision != request["expected_revision"]
          ):
              raise SystemExit("SAMUEL_GATEWAY_STATE=HARD_STOP readback mismatch")
          print(
              "SAMUEL_GATEWAY_STATE=PERSISTED research_id="
              +persisted.research_id+" revision="+str(persisted.revision)
          )
          PY

      - name: Persist acquired diagnostic evidence
        if: ${{ hashFiles('samuel-evidence-run-id.txt') != '' }}
        env:
          PYTHONPATH: src
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="$(cat samuel-evidence-run-id.txt)"
          artifact_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts")"
          artifact_id="$(python3 -c 'import json,sys; xs=[x for x in json.load(sys.stdin)["artifacts"] if x["name"]=="samuel-evidence-result" and not x.get("expired")]; assert len(xs)==1; print(xs[0]["id"])' <<<"$artifact_json")"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" -o evidence.zip
          rm -rf evidence-result && mkdir evidence-result
          unzip -q evidence.zip -d evidence-result
          gh api "repos/$GITHUB_REPOSITORY/issues/44/comments?per_page=100" > evidence-completion-comments.json
          python3 - <<'PY'
          import json
          from chatgpt_operation.controller.durable_state import (
              apply_evidence_patch, load_state_comment, state_write_request,
          )

          comments=json.load(open("evidence-completion-comments.json"))
          current=load_state_comment(comments)
          if current is None:
              raise SystemExit("SAMUEL_EVIDENCE=HARD_STOP durable state disappeared")
          artifact=json.load(open("evidence-result/samuel-evidence-result.json"))
          run_id=int(open("samuel-evidence-run-id.txt").read().strip())
          provenance=artifact.get("provenance") or {}
          if provenance.get("workflow_run_id") != run_id:
              raise SystemExit("SAMUEL_EVIDENCE=HARD_STOP artifact run identity mismatch")
          proposed=apply_evidence_patch(current,artifact)
          request=state_write_request(comments,proposed)
          open("samuel-evidence-completion-write.json","w").write(
              json.dumps(request,sort_keys=True,separators=(",",":"))
          )
          PY
          gh api "repos/$GITHUB_REPOSITORY/issues/44/comments?per_page=100" > evidence-completion-prewrite-comments.json
          python3 - <<'PY'
          import json
          from chatgpt_operation.controller.durable_state import validate_state_write_precondition
          validate_state_write_precondition(
              json.load(open("evidence-completion-prewrite-comments.json")),
              json.load(open("samuel-evidence-completion-write.json")),
          )
          PY
          method="$(python3 -c 'import json; print(json.load(open("samuel-evidence-completion-write.json"))["method"])')"
          comment_id="$(python3 -c 'import json; x=json.load(open("samuel-evidence-completion-write.json"))["comment_id"]; print("" if x is None else x)')"
          body="$(python3 -c 'import json; print(json.load(open("samuel-evidence-completion-write.json"))["body"])')"
          if [ "$method" = "PATCH" ]; then
            test -n "$comment_id"
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/44/comments" -f body="$body" >/dev/null
          fi
          gh api "repos/$GITHUB_REPOSITORY/issues/44/comments?per_page=100" > evidence-completion-readback-comments.json
          python3 - <<'PY'
          import json
          from chatgpt_operation.controller.durable_state import load_state_comment
          request=json.load(open("samuel-evidence-completion-write.json"))
          artifact=json.load(open("evidence-result/samuel-evidence-result.json"))
          persisted=load_state_comment(json.load(open("evidence-completion-readback-comments.json")))
          if persisted is None or persisted.revision != request["expected_revision"]:
              raise SystemExit("SAMUEL_EVIDENCE=HARD_STOP readback revision mismatch")
          recovery=persisted.diagnostic_recoveries.get(artifact["action_id"],{})
          if recovery.get("status") != "open" or recovery.get("evidence_dispatch") is not None:
              raise SystemExit("SAMUEL_EVIDENCE=HARD_STOP evidence completion state mismatch")
          print("SAMUEL_EVIDENCE=PERSISTED action_id="+artifact["action_id"])
          PY

      - name: Persist durable action completion
        if: ${{ hashFiles('samuel-action-run-id.txt') != '' }}
        env:
          PYTHONPATH: src
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="$(cat samuel-action-run-id.txt)"
          artifact_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts")"
          artifact_id="$(python3 -c 'import json,sys; xs=[x for x in json.load(sys.stdin)["artifacts"] if x["name"].startswith("samuel-execution-result-") and not x.get("expired")]; assert len(xs)==1; print(xs[0]["id"])' <<<"$artifact_json")"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" -o action-result.zip
          rm -rf action-result && mkdir action-result
          unzip -q action-result.zip -d action-result
          gh api "repos/$GITHUB_REPOSITORY/issues/44/comments?per_page=100" > action-completion-comments.json
          python3 - <<'PY'
          import json
          from chatgpt_operation.controller.execution import ExecutionResult
          from chatgpt_operation.controller.durable_state import (
              apply_action_completion, apply_action_failure,
              load_state_comment, state_write_request,
          )

          comments=json.load(open("action-completion-comments.json"))
          current=load_state_comment(comments)
          if current is None:
              raise SystemExit("SAMUEL_ACTION=HARD_STOP durable state disappeared")
          selected=json.load(open("samuel-selected-work.json"))
          terminal=json.load(open("samuel-action-terminal-observation.json"))
          try:
              raw=json.load(open("action-result/samuel-execution-result.json"))
          except json.JSONDecodeError:
              import copy
              from chatgpt_operation.controller.diagnostic import record_native_dispatch_evidence_failure
              action_id=selected["action_id"]
              run_id=int(open("samuel-action-run-id.txt").read().strip())
              proposed=copy.deepcopy(current)
              record_native_dispatch_evidence_failure(
                  proposed,action_id,workflow_run_id=run_id,
                  conclusion=str(terminal.get("conclusion") or "unknown"),
                  failure_kind="invalid_execution_result_json",
              )
              request=state_write_request(comments,proposed)
              open("samuel-action-completion-write.json","w").write(
                  json.dumps(request,sort_keys=True,separators=(",",":"))
              )
              open("samuel-action-evidence-recovery.txt","w").write(action_id)
              print("SAMUEL_ACTION=RECOVER_INVALID_EVIDENCE action_id="+action_id)
              raise SystemExit(0)
          result=ExecutionResult.from_dict(raw)
          item=current.action_queue.get(result.action_id)
          if isinstance(item,dict) and item.get("status") == "complete":
              if item.get("completion_result") != raw:
                  raise SystemExit("SAMUEL_ACTION=HARD_STOP conflicting completion replay")
              print("SAMUEL_ACTION=NOOP action_id="+result.action_id)
              raise SystemExit(0)
          if result.status.value in {"pass","noop"}:
              proposed=apply_action_completion(current,result)
          elif result.status.value == "failed":
              proposed=apply_action_failure(current,result)
          else:
              raise SystemExit("SAMUEL_ACTION=HARD_STOP unsupported terminal result "+result.status.value)
          request=state_write_request(comments,proposed)
          open("samuel-action-completion-write.json","w").write(
              json.dumps(request,sort_keys=True,separators=(",",":"))
          )
          print("SAMUEL_ACTION=PREPARED action_id="+result.action_id)
          PY
          if [ ! -f samuel-action-completion-write.json ]; then exit 0; fi
          gh api "repos/$GITHUB_REPOSITORY/issues/44/comments?per_page=100" > action-completion-prewrite-comments.json
          python3 - <<'PY'
          import json
          from chatgpt_operation.controller.durable_state import validate_state_write_precondition
          validate_state_write_precondition(
              json.load(open("action-completion-prewrite-comments.json")),
              json.load(open("samuel-action-completion-write.json")),
          )
          PY
          method="$(python3 -c 'import json; print(json.load(open("samuel-action-completion-write.json"))["method"])')"
          comment_id="$(python3 -c 'import json; x=json.load(open("samuel-action-completion-write.json"))["comment_id"]; print("" if x is None else x)')"
          body="$(python3 -c 'import json; print(json.load(open("samuel-action-completion-write.json"))["body"])')"
          if [ "$method" = "PATCH" ]; then
            test -n "$comment_id"
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/44/comments" -f body="$body" >/dev/null
          fi
          gh api "repos/$GITHUB_REPOSITORY/issues/44/comments?per_page=100" > action-completion-readback-comments.json
          python3 - <<'PY'
          import json
          from chatgpt_operation.controller.durable_state import load_state_comment
          request=json.load(open("samuel-action-completion-write.json"))
          persisted=load_state_comment(json.load(open("action-completion-readback-comments.json")))
          if persisted is None or persisted.revision != request["expected_revision"]:
              raise SystemExit("SAMUEL_ACTION=HARD_STOP completion readback revision mismatch")
          if __import__("pathlib").Path("samuel-action-evidence-recovery.txt").exists():
              action_id=open("samuel-action-evidence-recovery.txt").read().strip()
              item=persisted.action_queue.get(action_id,{})
              if item.get("status") != "pending":
                  raise SystemExit("SAMUEL_ACTION=HARD_STOP evidence recovery state mismatch")
              print("SAMUEL_ACTION=RECOVERED action_id="+action_id+" status=pending")
          else:
              raw=json.load(open("action-result/samuel-execution-result.json"))
              item=persisted.action_queue.get(raw["action_id"],{})
              expected="complete" if raw["status"] in {"pass","noop"} else None
              if expected is not None and item.get("status") != expected:
                  raise SystemExit("SAMUEL_ACTION=HARD_STOP completion state mismatch")
              print("SAMUEL_ACTION=PERSISTED action_id="+raw["action_id"]+" status="+str(item.get("status")))
          PY
      - name: Persist diagnostic recovery state
        if: ${{ hashFiles('samuel-diagnostic-run-id.txt') != '' }}
        env:
          PYTHONPATH: src
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="$(cat samuel-diagnostic-run-id.txt)"
          artifact_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts")"
          artifact_id="$(python3 -c 'import json,sys; xs=[x for x in json.load(sys.stdin)["artifacts"] if x["name"]=="samuel-diagnostic-result" and not x.get("expired")]; assert len(xs)==1; print(xs[0]["id"])' <<<"$artifact_json")"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" -o diagnostic.zip
          rm -rf diagnostic-result && mkdir diagnostic-result
          unzip -q diagnostic.zip -d diagnostic-result
          gh api "repos/$GITHUB_REPOSITORY/issues/44/comments?per_page=100" > diagnostic-completion-comments.json
          python3 - <<'PY'
          import json
          from chatgpt_operation.controller.durable_state import (
              apply_diagnostic_patch, load_state_comment, state_write_request,
          )

          comments=json.load(open("diagnostic-completion-comments.json"))
          current=load_state_comment(comments)
          if current is None:
              raise SystemExit("SAMUEL_DIAGNOSTIC=HARD_STOP durable state disappeared")
          artifact=json.load(open("diagnostic-result/samuel-diagnostic-result.json"))
          run_id=int(open("samuel-diagnostic-run-id.txt").read().strip())
          provenance=artifact.get("provenance") or {}
          if provenance.get("workflow_run_id") != run_id:
              raise SystemExit("SAMUEL_DIAGNOSTIC=HARD_STOP artifact run identity mismatch")
          if artifact.get("advanced") is not True:
              raise SystemExit("SAMUEL_DIAGNOSTIC=HARD_STOP non-advancing artifact")
          proposed=apply_diagnostic_patch(current,artifact)
          request=state_write_request(comments,proposed)
          open("samuel-diagnostic-completion-write.json","w").write(
              json.dumps(request,sort_keys=True,separators=(",",":"))
