name: Samuel Reasoning Wake

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read

jobs:
  forward:
    if: ${{ contains(github.event.comment.body, '<!-- samuel-reasoning-submission -->') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Forward accepted reasoning wake to Samuel Bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
          SAMUEL_REF: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/samuel-bootstrap.yml/dispatches" \
            -f ref="$SAMUEL_REF"
