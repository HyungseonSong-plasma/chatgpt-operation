name: Samuel Diagnostic Recovery
run-name: Samuel Diagnostic Recovery dispatch:${{ inputs.samuel_dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      samuel_dispatch_id:
        description: Durable Samuel diagnostic dispatch identity
        required: true
        type: string
      recovery_json:
        description: Typed diagnostic recovery selection
        required: true
        type: string
      controller_state:
        description: Authoritative encoded Samuel controller state
        required: true
        type: string

permissions:
  contents: read
  actions: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Advance one diagnostic phase
        env:
          PYTHONPATH: src
          RECOVERY_JSON: ${{ inputs.recovery_json }}
          CONTROLLER_STATE: ${{ inputs.controller_state }}
          SAMUEL_DISPATCH_ID: ${{ inputs.samuel_dispatch_id }}
        run: |
          python3 - <<'PY'
          import json, os
          from chatgpt_operation.controller.durable_state import decode_state
          from chatgpt_operation.controller.diagnostic import (
              DiagnosticAdvance,
              advance_diagnostic,
              record_diagnostic_wait,
          )

          selection=json.loads(os.environ["RECOVERY_JSON"])
          if selection.get("kind") != "diagnostic" or not selection.get("action_id"):
              raise SystemExit("SAMUEL_DIAGNOSTIC=HARD_STOP invalid recovery selection")
          state=decode_state(os.environ["CONTROLLER_STATE"])
          action_id=selection["action_id"]
          recovery=state.diagnostic_recoveries.get(action_id)
          if not isinstance(recovery,dict) or recovery.get("status") != "open":
              raise SystemExit(
                  "SAMUEL_DIAGNOSTIC=HARD_STOP recovery is not open in authoritative state"
              )

          result=advance_diagnostic(state,action_id)
          if not result.advanced:
              status=record_diagnostic_wait(
                  state,action_id,phase=result.phase,evidence=result.evidence
              )
              result=DiagnosticAdvance(
                  result.action_id,
                  result.phase,
                  True,
                  result.evidence+"; recovery_status="+status,
              )

          dispatch_id=os.environ["SAMUEL_DISPATCH_ID"].strip()
          if not dispatch_id:
              raise SystemExit("SAMUEL_DIAGNOSTIC=HARD_STOP dispatch identity missing")
          output={
              "schema_version":1,
              "action_id":result.action_id,
              "phase":result.phase,
              "advanced":result.advanced,
              "evidence":result.evidence,
              "recovery":state.diagnostic_recoveries[action_id],
              "revision_delta":1,
              "provenance":{
                  "schema_version":1,
                  "workflow_run_id":int(os.environ["GITHUB_RUN_ID"]),
                  "run_attempt":int(os.environ["GITHUB_RUN_ATTEMPT"]),
                  "head_sha":os.environ["GITHUB_SHA"],
                  "action_id":action_id,
                  "dispatch_id":dispatch_id,
              },
          }
          open("samuel-diagnostic-result.json","w").write(
              json.dumps(output,sort_keys=True,separators=(",",":"))+"\n"
          )
          print("SAMUEL_DIAGNOSTIC=ADVANCED phase="+result.phase)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: samuel-diagnostic-result
          path: samuel-diagnostic-result.json
          if-no-files-found: error

      - name: Wake Samuel controller after worker completion
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run samuel-bootstrap.yml --ref main
