name: Samuel Diagnostic Recovery

on:
  workflow_dispatch:
    inputs:
      recovery_json:
        description: Typed diagnostic recovery selection
        required: true
        type: string
      controller_state:
        description: Authoritative encoded Samuel controller state
        required: true
        type: string

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate recovery phase
        env:
          PYTHONPATH: src
          RECOVERY_JSON: ${{ inputs.recovery_json }}
          CONTROLLER_STATE: ${{ inputs.controller_state }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os
          from chatgpt_operation.controller.durable_state import decode_state, encode_state
          from chatgpt_operation.controller.diagnostic import (
              advance_diagnostic, corrective_plan_from_recovery,
              recovery_authorization, recovery_authorization_to_dict,
              resolve_from_execution_receipt,
          )
          from chatgpt_operation.github.actions_runtime import GitHubActionsTransport, execution_result_artifact_metadata
          from chatgpt_operation.controller.execution import ExecutionResult
          import io, urllib.request, zipfile
          from chatgpt_operation.github.native_orchestration import dispatch_native_plan
          recovery=json.loads(os.environ["RECOVERY_JSON"])
          if recovery.get("kind") != "diagnostic" or not recovery.get("action_id"):
              raise SystemExit("SAMUEL_DIAGNOSTIC=HARD_STOP invalid recovery selection")
          state=decode_state(os.environ["CONTROLLER_STATE"])
          action_id=recovery["action_id"]
          if action_id not in state.diagnostic_recoveries or state.diagnostic_recoveries[action_id].get("status") != "open":
              raise SystemExit("SAMUEL_DIAGNOSTIC=HARD_STOP recovery is not open in authoritative state")
          result=advance_diagnostic(state, action_id)
          execution_run_id=None
          if result.phase == "apply_corrective_action" and result.advanced:
              plan=corrective_plan_from_recovery(state, action_id)
              auth=recovery_authorization(state, action_id)
              transport=GitHubActionsTransport(os.environ["GITHUB_REPOSITORY"],os.environ["GITHUB_TOKEN"])
              outcome=dispatch_native_plan(
                  plan, transport=transport, ref="main",
                  expected_head_sha=os.environ["GITHUB_SHA"],
                  recovery_state=encode_state(state),
                  recovery_authorization=recovery_authorization_to_dict(auth),
                  timeout_seconds=600, poll_interval_seconds=5,
              )
              obs=outcome["observation"]
              ids=obs.get("matched_run_ids") or ([obs.get("workflow_run_id")] if obs.get("workflow_run_id") else [])
              if len(ids)!=1:
                  raise SystemExit("SAMUEL_DIAGNOSTIC=HARD_STOP ambiguous corrective run")
              execution_run_id=ids[0]
              meta=execution_result_artifact_metadata(transport, execution_run_id)
              request=urllib.request.Request(
                  "https://api.github.com/repos/"+os.environ["GITHUB_REPOSITORY"]+
                  "/actions/artifacts/"+str(meta["id"])+"/zip",
                  headers={
                      "Authorization":"Bearer "+os.environ["GITHUB_TOKEN"],
                      "Accept":"application/vnd.github+json",
                      "X-GitHub-Api-Version":"2026-03-10",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  archive=response.read()
              with zipfile.ZipFile(io.BytesIO(archive)) as zf:
                  names=[n for n in zf.namelist() if n.endswith("samuel-execution-result.json")]
                  if len(names)!=1:
                      raise SystemExit("SAMUEL_DIAGNOSTIC=HARD_STOP invalid corrective result artifact")
                  corrective_result=ExecutionResult.from_dict(json.loads(zf.read(names[0])))
              resolution=resolve_from_execution_receipt(
                  state, action_id, corrective_result=corrective_result
              )
              result=resolution
          output={
              "action_id":result.action_id, "phase":result.phase,
              "advanced":result.advanced, "evidence":result.evidence,
              "recovery":state.diagnostic_recoveries[action_id],
              "revision_delta":state.revision-int(json.loads(os.environ["RECOVERY_JSON"]).get("recovery",{}).get("_revision",0)),
              "execution_run_id":execution_run_id,
          }
          # One diagnostic phase is one durable revision; bootstrap validates this.
          output["revision_delta"]=1 if result.advanced else 0
          open("samuel-diagnostic-result.json","w").write(json.dumps(output,sort_keys=True,separators=(",",":")))
          print("SAMUEL_DIAGNOSTIC="+("ADVANCED" if result.advanced else "WAIT"))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: samuel-diagnostic-result
          path: samuel-diagnostic-result.json
          if-no-files-found: error
