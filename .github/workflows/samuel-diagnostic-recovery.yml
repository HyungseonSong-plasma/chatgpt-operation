name: Samuel Diagnostic Recovery
run-name: Samuel Diagnostic Recovery dispatch:${{ inputs.samuel_dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      samuel_dispatch_id:
        description: Durable Samuel diagnostic dispatch identity
        required: false
        default: ""
        type: string
      recovery_json:
        description: Typed diagnostic recovery selection
        required: true
        type: string
      controller_state:
        description: Authoritative encoded Samuel controller state
        required: true
        type: string

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate recovery phase
        env:
          PYTHONPATH: src
          RECOVERY_JSON: ${{ inputs.recovery_json }}
          CONTROLLER_STATE: ${{ inputs.controller_state }}
          SAMUEL_DISPATCH_ID: ${{ inputs.samuel_dispatch_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os
          from chatgpt_operation.controller.durable_state import decode_state
          from chatgpt_operation.controller.diagnostic import (
              advance_diagnostic, record_diagnostic_wait,
          )
          recovery=json.loads(os.environ["RECOVERY_JSON"])
          if recovery.get("kind") != "diagnostic" or not recovery.get("action_id"):
              raise SystemExit("SAMUEL_DIAGNOSTIC=HARD_STOP invalid recovery selection")
          state=decode_state(os.environ["CONTROLLER_STATE"])
          action_id=recovery["action_id"]
          if action_id not in state.diagnostic_recoveries or state.diagnostic_recoveries[action_id].get("status") != "open":
              raise SystemExit("SAMUEL_DIAGNOSTIC=HARD_STOP recovery is not open in authoritative state")
          result=advance_diagnostic(state, action_id)
          execution_run_id=None
          if not result.advanced:
              status=record_diagnostic_wait(
                  state, action_id, phase=result.phase, evidence=result.evidence
              )
              result=type(result)(
                  result.action_id, result.phase, True,
                  result.evidence+"; recovery_status="+status,
              )
          dispatch_id=os.environ.get("SAMUEL_DISPATCH_ID","").strip()
          output={
              "schema_version":1,
              "action_id":result.action_id, "phase":result.phase,
              "advanced":result.advanced, "evidence":result.evidence,
              "recovery":state.diagnostic_recoveries[action_id],
              "revision_delta":state.revision-int(json.loads(os.environ["RECOVERY_JSON"]).get("recovery",{}).get("_revision",0)),
              "execution_run_id":execution_run_id,
              "provenance":{
                  "schema_version":1,
                  "workflow_run_id":int(os.environ["GITHUB_RUN_ID"]),
                  "run_attempt":int(os.environ["GITHUB_RUN_ATTEMPT"]),
                  "head_sha":os.environ["GITHUB_SHA"],
                  "action_id":action_id,
                  "dispatch_id":dispatch_id,
              },
          }
          # One diagnostic phase is one durable revision; bootstrap validates this.
          output["revision_delta"]=1 if result.advanced else 0
          open("samuel-diagnostic-result.json","w").write(json.dumps(output,sort_keys=True,separators=(",",":")))
          print("SAMUEL_DIAGNOSTIC="+("ADVANCED" if result.advanced else "WAIT"))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: samuel-diagnostic-result
          path: samuel-diagnostic-result.json
          if-no-files-found: error
