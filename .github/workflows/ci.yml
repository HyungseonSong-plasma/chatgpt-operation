name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit without third-party actions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Compile Python surfaces
        run: |
          python3 -m compileall -q src tests
          python3 - <<'PY'
          from pathlib import Path
          import ast
          import re

          failures = []
          for path in Path(".github/workflows").glob("*.yml"):
              text = path.read_text(encoding="utf-8")
              if "\\\\n" in text:
                  failures.append(f"{path}: contains literal \\\\n escape")
              blocks = re.findall(r"python3 - <<'PY'\\n((?:[ ]{10}.*\\n)+)[ ]{10}PY", text)
              for index, block in enumerate(blocks, 1):
                  source = "\\n".join(
                      line[10:] if line.startswith(" " * 10) else line
                      for line in block.splitlines()
                  )
                  try:
                      ast.parse(source, filename=f"{path}:embedded-python-{index}")
                  except SyntaxError as exc:
                      failures.append(str(exc))
          if failures:
              raise SystemExit("\\n".join(failures))
          PY
      - name: Run tests
        env:
          PYTHONPATH: src
        run: python3 -m unittest discover -s tests -v
      - name: Verify CLI surface
        env:
          PYTHONPATH: src
        run: |
          python3 -m chatgpt_operation.cli --help
          python3 -m chatgpt_operation.cli skills validate-contracts
          python3 -m chatgpt_operation.cli skills validate-capabilities
          python3 -m chatgpt_operation.cli repository mutate --help
          python3 -m chatgpt_operation.cli source verify --help
          python3 -m chatgpt_operation.cli work new --help
          python3 -m chatgpt_operation.cli work run --help
          python3 -m chatgpt_operation.cli work self-test
          python3 -m chatgpt_operation.cli matrix self-test
          python3 -m chatgpt_operation.cli github dispatch-actions --help
          python3 -m chatgpt_operation.cli github dispatch-native --help
          python3 -m chatgpt_operation.cli github plan-actions-execution --help
          python3 -m chatgpt_operation.cli github actions-execution-self-test
          python3 -m chatgpt_operation.cli github execute-native --help
          python3 -m chatgpt_operation.cli controller evaluate --help
          python3 -m chatgpt_operation.cli controller self-test
          python3 -m chatgpt_operation.cli controller throughput --help
          python3 -m chatgpt_operation.cli controller throughput-self-test
          python3 -m chatgpt_operation.cli controller state-refresh --help
          python3 -m chatgpt_operation.cli controller state-refresh-self-test
