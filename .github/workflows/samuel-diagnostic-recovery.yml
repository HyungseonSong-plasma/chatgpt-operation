name: Samuel Diagnostic Recovery

on:
  workflow_dispatch:
    inputs:
      recovery_json:
        description: Typed diagnostic recovery selection
        required: true
        type: string

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate recovery phase
        env:
          PYTHONPATH: src
          RECOVERY_JSON: ${{ inputs.recovery_json }}
        run: |
          python3 - <<'PY'
          import json, os
          recovery=json.loads(os.environ["RECOVERY_JSON"])
          if recovery.get("kind") != "diagnostic" or not recovery.get("action_id"):
              raise SystemExit("SAMUEL_DIAGNOSTIC=HARD_STOP invalid recovery selection")
          data=recovery.get("recovery") or {}
          if data.get("status") != "open":
              raise SystemExit("SAMUEL_DIAGNOSTIC=HARD_STOP recovery is not open")
          from chatgpt_operation.controller.research import ResearchStage, ResearchState
          from chatgpt_operation.controller.diagnostic import advance_diagnostic
          state=ResearchState(
              "issue-44-controller",
              "autonomously finish governed work",
              stage=ResearchStage.EXECUTE,
              diagnostic_recoveries={recovery["action_id"]: data},
          )
          result=advance_diagnostic(state, recovery["action_id"])
          output={
              "action_id":result.action_id,
              "phase":result.phase,
              "advanced":result.advanced,
              "evidence":result.evidence,
              "recovery":state.diagnostic_recoveries[recovery["action_id"]],
              "revision_delta":state.revision,
          }
          open("samuel-diagnostic-result.json","w").write(
              json.dumps(output,sort_keys=True,separators=(",",":"))
          )
          print("SAMUEL_DIAGNOSTIC="+("ADVANCED" if result.advanced else "WAIT"))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: samuel-diagnostic-result
          path: samuel-diagnostic-result.json
          if-no-files-found: error
