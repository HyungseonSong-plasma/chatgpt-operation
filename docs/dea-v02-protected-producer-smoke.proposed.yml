# PROPOSED / NOT DEPLOYED: Human-controlled copy via reviewed privileged PR ONLY.
# Issue #254 approval is an adoption-review authorization, not workflow-write
# permission for Samuel/DEA. File must not be installed by an AI connector.
# This smoke test cannot admit any DEA candidate to Fitness/Champion.
name: DEA Human-Approved Signed Artifact Smoke

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: "Exact 40-character main commit SHA, checked before signing"
        required: true
        type: string

permissions: {}

concurrency:
  group: dea-human-signed-smoke
  cancel-in-progress: false

jobs:
  signed-smoke:
    if: "${{ github.ref == 'refs/heads/main' && github.actor == 'HyungseonSong-plasma' }"
    environment:
      name: dea-human-break-glass
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout reviewed exact main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ github.sha }"
          persist-credentials: false
          fetch-depth: 1

      - name: Verify human-initiated exact immutable target
        shell: bash
        env:
          EXPECTED_MAIN_SHA: "${{ inputs.expected_main_sha }"
        run: |
          set -euo pipefail
          [[ "$EXPECTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 11
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || exit 12
          [[ "$GITHUB_ACTOR" == "HyungseonSong-plasma" ]] || exit 13
          [[ "$EXPECTED_MAIN_SHA" == "$GITHUB_SHA" ]] || exit 14
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || exit 15
          test -f src/chatgpt_operation/controller/dea_attested_payload.py
          test -f src/chatgpt_operation/controller/dea_attestation_verify.py

      - name: Generate deterministic non-candidate signed subject
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          from chatgpt_operation.controller.dea_attested_payload import (
              build_payload, inspect_payload,
          )

          head = os.environ["GITHUB_SHA"]
          run_id = int(os.environ["GITHUB_RUN_ID"])
          # SMOKE ONLY: No codeQA corpus or candidate metric is measured.
          # All identity SHAs are pinned to this single trusted test commit;
          # this has no valid Fitness/protocol meaning for A/B/C competition.
          subject = build_payload(
              repository=os.environ["GITHUB_REPOSITORY"],
              run_id=run_id,
              candidate_head_sha=head,
              analyzed_source_sha=head,
              oracle_revision_sha=head,
              measurement_set_sha=head,
              observations={
                  "source_revision": head,
                  "records": [],
                  "smoke_only": True,
                  "no_codeqa_observation": True,
              },
              metrics={
                  "status": "NOT_MEASURED",
                  "smoke_only": True,
              },
              summary={
                  "status": "SMOKE_ONLY_NOT_FITNESS",
                  "pareto_eligible": False,
                  "champion": None,
              },
          )
          output = Path("dist/dea-evidence.zip")
          output.parent.mkdir(exist_ok=True)
          with output.open("xb") as fp:
              fp.write(subject)
          result = inspect_payload(
              subject, repository=os.environ["GITHUB_REPOSITORY"],
              run_id=run_id,
              candidate_head_sha=head, analyzed_source_sha=head,
              oracle_revision_sha=head, measurement_set_sha=head,
          )
          assert result["status"] == "SIGNED_SUBJECT_CONTENT_VALID"
          assert not result["automatic_fitness_pass"]
          print("DEA_SMOKE_SUBJECT_SHA256=" + result["payload_sha256"])
          PY

      - name: Attest exact inner subject (Sigstore/SLSA)
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/dea-evidence.zip
          create-storage-record: false

      - name: Upload same subject as GitHub Artifact (outer ZIP wrapper)
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "dea-smoke-${{ github.run_id }-${{ github.run_attempt }"
          path: dist/dea-evidence.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: false

      - name: Publish untrusted-to-Fitness verification references
        shell: bash
        env:
          ARTIFACT_ID: "${{ steps.upload.outputs.artifact-id }"
          ARTIFACT_DIGEST: "${{ steps.upload.outputs.artifact-digest }"
          ATTESTATION_ID: "${{ steps.attest.outputs.attestation-id }"
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || exit 21
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]] || exit 22
          [[ "$ATTESTATION_ID" =~ ^[1-9][0-9]*$ ]] || exit 23
          {
            echo "## DEA non-candidate signed smoke — independent review required"
            echo "Run: $GITHUB_RUN_ID"
            echo "Head: $GITHUB_SHA"
            echo "Artifact ID: $ARTIFACT_ID"
            echo "Outer Artifact SHA256: $ARTIFACT_DIGEST"
            echo "Inner signed subject SHA256: $(sha256sum dist/dea-evidence.zip | cut -d' ' -f1)"
            echo "Attestation ID: $ATTESTATION_ID"
            echo "Fitness: UNKNOWN / not eligible (SMOKE_ONLY)"
          } >> "$GITHUB_STEP_SUMMARY"
