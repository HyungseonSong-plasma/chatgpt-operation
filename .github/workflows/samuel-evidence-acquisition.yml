name: Samuel Evidence Acquisition
run-name: Samuel Evidence Acquisition dispatch:${{ inputs.samuel_dispatch_id }}
on:
  workflow_dispatch:
    inputs:
      samuel_dispatch_id:
        description: Durable evidence acquisition correlation identity
        required: true
        type: string
      recovery_json:
        required: true
        type: string
      controller_state:
        required: true
        type: string
permissions:
  contents: read
  actions: write
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Acquire typed recovery evidence
        env:
          PYTHONPATH: src
          RECOVERY_JSON: ${{ inputs.recovery_json }}
          CONTROLLER_STATE: ${{ inputs.controller_state }}
          GITHUB_TOKEN: ${{ github.token }}
          SAMUEL_DISPATCH_ID: ${{ inputs.samuel_dispatch_id }}
        run: |
          python3 - <<'PY'
          import json, os
          from chatgpt_operation.controller.durable_state import decode_state, encode_state
          from chatgpt_operation.controller.diagnostic import record_acquired_diagnostic_evidence
          from chatgpt_operation.skills.capability_registry import resolve_providers
          recovery=json.loads(os.environ["RECOVERY_JSON"])
          action_id=recovery.get("action_id")
          state=decode_state(os.environ["CONTROLLER_STATE"])
          item=state.diagnostic_recoveries.get(action_id)
          if not item or item.get("status")!="needs_evidence":
              raise SystemExit("SAMUEL_EVIDENCE=HARD_STOP recovery is not waiting for evidence")
          failure=item.get("failure") or {}
          details=failure.get("details") or {}
          provider=str(details.get("provider","")).strip()
          action=str((item.get("source_plan") or {}).get("payload",{}).get("action",""))
          capability={
              "merge_pr":"GITHUB_PR_WRITE",
              "comment_issue":"GITHUB_ISSUE_WRITE",
              "close_issue":"GITHUB_ISSUE_WRITE",
              "dispatch_workflow":"GITHUB_WORKFLOW_DISPATCH",
          }.get(action)
          if capability is None:
              raise SystemExit("SAMUEL_EVIDENCE=HARD_STOP unknown source action capability")
          providers=[p.name for p in resolve_providers(capability)]
          evidence={
              "provider":provider,
              "error_type":str(details.get("error_type","")).strip(),
              "provider_status":str(details.get("provider_status","")).strip(),
              "available_providers":sorted(set(providers)),
              "required_capability":capability,
              "evidence_source":"repository-capability-registry",
              "evidence_request_fingerprint":(item.get("evidence_request") or {}).get("fingerprint"),
          }
          if not evidence["available_providers"]:
              raise SystemExit("SAMUEL_EVIDENCE=HARD_STOP no repository providers resolved")
          record_acquired_diagnostic_evidence(state,action_id,evidence)
          out={
              "schema_version":1,
              "action_id":action_id,
              "evidence":evidence,
              "controller_state":encode_state(state),
              "revision_delta":1,
              "provenance":{
                  "schema_version":1,
                  "workflow_run_id":int(os.environ["GITHUB_RUN_ID"]),
                  "run_attempt":int(os.environ["GITHUB_RUN_ATTEMPT"]),
                  "head_sha":os.environ["GITHUB_SHA"],
                  "action_id":action_id,
                  "dispatch_id":os.environ["SAMUEL_DISPATCH_ID"],
              },
          }
          open("samuel-evidence-result.json","w").write(json.dumps(out,sort_keys=True,separators=(",",":")))
          print("SAMUEL_EVIDENCE=ACQUIRED action_id="+action_id)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: samuel-evidence-result
          path: samuel-evidence-result.json
          if-no-files-found: error

      - name: Wake Samuel controller after worker completion
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run samuel-bootstrap.yml --ref main
