name: Samuel Trusted PR Validation

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  validate:
    if: >-
      github.event.workflow_run.conclusion == 'action_required' &&
      github.event.workflow_run.actor.login == 'github-actions[bot]' &&
      startsWith(github.event.workflow_run.head_branch, 'samuel/')
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact Samuel PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Verify exact source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.workflow_run.head_sha }}"

      - name: Compile Python surfaces
        run: |
          python3 -m compileall -q src tests tools
          python3 tools/validate_python_surfaces.py

      - name: Run tests
        env:
          PYTHONPATH: src
        run: |
          python3 -m unittest discover -s tests -v
          python3 tools/run_function_tests.py

      - name: Verify CLI surface
        env:
          PYTHONPATH: src
        run: |
          python3 -m chatgpt_operation.cli --help
          python3 -m chatgpt_operation.cli skills validate-contracts
          python3 -m chatgpt_operation.cli skills validate-capabilities
          python3 -m chatgpt_operation.cli controller self-test

  publish:
    if: >-
      always() &&
      github.event.workflow_run.conclusion == 'action_required' &&
      github.event.workflow_run.actor.login == 'github-actions[bot]' &&
      startsWith(github.event.workflow_run.head_branch, 'samuel/')
    needs: validate
    permissions:
      actions: write
      statuses: write
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Publish trusted validation status
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: |
          set -euo pipefail
          state=failure
          description="Samuel trusted validation failed"
          if [ "$VALIDATION_RESULT" = "success" ]; then
            state=success
            description="Samuel trusted validation passed"
          fi
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state="$state" \
            -f context="samuel/trusted-validation" \
            -f description="$description" >/dev/null

      - name: Wake Samuel Controller on trusted main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run samuel-bootstrap.yml --ref main

      - name: Propagate validation failure
        if: ${{ needs.validate.result != 'success' }}
        run: exit 1
