[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chatgpt-operation"
version = "0.1.0"
description = "Deterministic operating skills for ChatGPT-managed repositories"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
chatgpt-op = "chatgpt_operation.repository.mutation:main"

[tool.setuptools.packages.find]
where = ["src"]
