name: Samuel Bootstrap

on:
  issues:
    types: [opened, reopened, labeled]
  pull_request:
    types: [opened, reopened, synchronize, closed]
  schedule:
    - cron: '55 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: samuel-bootstrap
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Persist bootstrap heartbeat evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          marker='<!-- samuel-bootstrap-heartbeat -->'
          payload="$(python3 - <<'PY'
          import json, os
          print(json.dumps({
              "schema_version": 1,
              "event_name": os.environ["GITHUB_EVENT_NAME"],
              "event_action": os.environ.get("GITHUB_EVENT_ACTION", ""),
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "head_sha": os.environ["GITHUB_SHA"],
              "ref": os.environ["GITHUB_REF"],
          }, sort_keys=True, separators=(",", ":")))
          PY
          )"
          body="$marker
          \`\`\`json
          $payload
          \`\`\`"
          comments="$(gh api "repos/$GITHUB_REPOSITORY/issues/44/comments?per_page=100")"
          comment_id="$(python3 -c 'import json,sys; m="<!-- samuel-bootstrap-heartbeat -->"; xs=json.load(sys.stdin); ids=[x["id"] for x in xs if m in x.get("body","")]; assert len(ids)<=1; print(ids[0] if ids else "")' <<<"$comments")"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/44/comments" -f body="$body" >/dev/null
          fi
      - name: Admit explicitly labeled issue work
        if: ${{ github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'samuel') }}
        env:
          PYTHONPATH: src
          GH_TOKEN: ${{ github.token }}
          ISSUE_JSON: ${{ toJSON(github.event.issue) }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/issues/44/comments?per_page=100" > admission-comments.json
          python3 - <<'PY'
          import json, os
          from chatgpt_operation.controller.issue_ingestion import admit_issue
          comments=json.load(open("admission-comments.json"))
          issue=json.loads(os.environ["ISSUE_JSON"])
          write=admit_issue(comments,issue)
          open("samuel-admission-body.txt","w").write(write["body"])
          open("samuel-admission-comment-id.txt","w").write(
              "" if write["comment_id"] is None else str(write["comment_id"])
          )
          print("SAMUEL_ADMISSION="+("NEW" if write["changed"] else "NOOP")+" work_id="+write["work_id"])
          PY
          body="$(cat samuel-admission-body.txt)"
          comment_id="$(cat samuel-admission-comment-id.txt)"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/44/comments" -f body="$body" >/dev/null
          fi

      - name: Load durable controller state and select work
        env:
          PYTHONPATH: src
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/issues/44/comments?per_page=100" > samuel-issue-comments.json
          python3 - <<'PY'
          import json
          from chatgpt_operation.controller.bootstrap import load_pending, select_controller_work
          from chatgpt_operation.controller.durable_state import load_state_comment
          from chatgpt_operation.controller.issue_ingestion import ADMISSION_MARKER, decode_admission_ledger

          comments=json.load(open("samuel-issue-comments.json"))
          state=load_state_comment(comments)
          pending=load_pending("automation/samuel/bootstrap.json")
          admission=[c for c in comments if ADMISSION_MARKER in str(c.get("body",""))]
          if len(admission)>1:
              raise SystemExit("SAMUEL_BOOTSTRAP=HARD_STOP multiple admission ledgers")
          admitted={} if not admission else decode_admission_ledger(str(admission[0]["body"]))
          selected=select_controller_work(
              pending,
              diagnostic_recoveries={} if state is None else state.diagnostic_recoveries,
              action_queue={} if state is None else state.action_queue,
              admitted_work=admitted,
          )
          if selected is None:
              payload={"kind":"idle"}
          elif selected[0] == "diagnostic":
              payload={"kind":"diagnostic", **selected[1]}
          elif selected[0] == "action":
              payload={"kind":"action", **selected[1]}
          elif selected[0] == "evidence":
              payload={"kind":"evidence", **selected[1]}
          elif selected[0] == "issue":
              payload={"kind":"issue", **selected[1]}
          else:
              work=selected[1]
              payload={
                  "kind":"pending",
                  "work_id":work.work_id,
                  "workflow":work.workflow,
                  "ref":work.ref,
              }
          open("samuel-selected-work.json","w").write(
              json.dumps(payload,sort_keys=True,separators=(",",":"))
          )
          print("SAMUEL_SELECTED_WORK="+payload["kind"])
          PY

      - name: Persist guarded Issue planning evidence
        if: ${{ hashFiles('samuel-selected-work.json') != '' }}
        env:
          PYTHONPATH: src
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from chatgpt_operation.controller.decisions import DecisionRegistry
          from chatgpt_operation.controller.issue_planning import plan_admitted_issue

          selected=json.load(open("samuel-selected-work.json"))
          if selected.get("kind") != "issue":
              raise SystemExit(0)
          registry=DecisionRegistry.load("automation/samuel/decisions.json")
          result=plan_admitted_issue(selected,registry=registry)
          payload={
              "schema_version":1,
              "work_id":result.work_id,
              "outcome":result.outcome.value,
              "reason":result.reason,
              "action_plan":result.action_plan,
              "reasoning_context":result.envelope.as_reasoning_context(),
          }
          open("samuel-issue-planning.json","w").write(
              json.dumps(payload,sort_keys=True,separators=(",",":"))
          )
          print("SAMUEL_ISSUE_PLANNING="+result.outcome.value.upper()+" work_id="+result.work_id)
          PY
          if [ ! -f samuel-issue-planning.json ]; then exit 0; fi
          marker='<!-- samuel-issue-planning -->'
          body="$marker
          ~~~json
          $(cat samuel-issue-planning.json)
          ~~~"
          comments="$(gh api "repos/$GITHUB_REPOSITORY/issues/44/comments?per_page=100")"
          comment_id="$(python3 -c 'import json,sys; m="<!-- samuel-issue-planning -->"; xs=json.load(sys.stdin); ids=[x["id"] for x in xs if m in x.get("body","")]; assert len(ids)<=1; print(ids[0] if ids else "")' <<<"$comments")"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/44/comments" -f body="$body" >/dev/null
          fi

      - name: Wake pending Samuel work
        env:
          PYTHONPATH: src
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os
          from chatgpt_operation.controller.bootstrap import load_pending, resolve_bootstrap_provider
          from chatgpt_operation.github.actions_runtime import GitHubActionsTransport, dispatch_and_wait

          repo=os.environ["GITHUB_REPOSITORY"]
          sha=os.environ["GITHUB_SHA"]
          transport=GitHubActionsTransport(repo, os.environ["GITHUB_TOKEN"])
          selected=__import__("json").load(open("samuel-selected-work.json"))
          comments=__import__("json").load(open("samuel-issue-comments.json"))
          if selected.get("kind") == "evidence":
              outcome=dispatch_and_wait(
                  transport, workflow="samuel-evidence-acquisition.yml", ref="main",
                  inputs={
                      "recovery_json":json.dumps(selected,sort_keys=True,separators=(",",":")),
                      "controller_state":next(
                          (str(c.get("body","")) for c in comments
                           if "<!-- samuel-controller-state -->" in str(c.get("body",""))),
                          "",
                      ),
                  },
                  correlation_id="evidence-"+selected["action_id"],
                  correlation_input=None,
                  expected_head_sha=sha,
                  timeout_seconds=600,poll_interval_seconds=5,
              )
              obs=outcome["observation"]
              ids=obs.get("matched_run_ids") or ([obs.get("workflow_run_id")] if obs.get("workflow_run_id") else [])
              if obs.get("status")!="MATCHED_TERMINAL" or obs.get("conclusion")!="success" or len(ids)!=1:
                  raise SystemExit("SAMUEL_BOOTSTRAP=HARD_STOP evidence acquisition "+str(obs))
              open("samuel-evidence-run-id.txt","w").write(str(ids[0])+"\n")
              print("SAMUEL_BOOTSTRAP=EVIDENCE_DISPATCHED action_id="+selected["action_id"])
              raise SystemExit(0)
          if selected.get("kind") == "action":
              import json
              from chatgpt_operation.controller.action_plan import ActionPlan
              from chatgpt_operation.github.native_orchestration import dispatch_native_plan
              plan=ActionPlan.from_dict(selected["plan"])
              if plan.idempotency_key != selected["action_id"]:
                  raise SystemExit("SAMUEL_BOOTSTRAP=HARD_STOP durable action identity mismatch")
              outcome=dispatch_native_plan(
                  plan, transport=transport, ref="main",
                  expected_head_sha=sha, timeout_seconds=600, poll_interval_seconds=5,
              )
              observation=outcome["observation"]
              if observation.get("status") != "MATCHED_TERMINAL":
                  raise SystemExit("SAMUEL_BOOTSTRAP=HARD_STOP durable action dispatch "+str(observation))
              run_ids=observation.get("matched_run_ids") or ([observation.get("workflow_run_id")] if observation.get("workflow_run_id") else [])
              if len(run_ids)!=1:
                  raise SystemExit("SAMUEL_BOOTSTRAP=HARD_STOP ambiguous durable action run")
              open("samuel-action-run-id.txt","w").write(str(run_ids[0])+"\n")
              print("SAMUEL_BOOTSTRAP=ACTION_DISPATCHED action_id="+selected["action_id"])
              raise SystemExit(0)
          if selected.get("kind") == "diagnostic":
              outcome=dispatch_and_wait(
                  transport,
                  workflow="samuel-diagnostic-recovery.yml",
                  ref="main",
                  inputs={"recovery_json": __import__("json").dumps(selected,sort_keys=True,separators=(",",":")), "controller_state": next((str(c.get("body","")) for c in comments if "<!-- samuel-controller-state -->" in str(c.get("body",""))), "")},
                  correlation_id="diagnostic:"+selected["action_id"],
                  correlation_input=None,
                  expected_head_sha=sha,
                  timeout_seconds=600,
                  poll_interval_seconds=5,
              )
              observation=outcome["observation"]
              if observation.get("status") != "MATCHED_TERMINAL" or observation.get("conclusion") != "success":
                  raise SystemExit("SAMUEL_BOOTSTRAP=HARD_STOP diagnostic dispatch "+str(observation))
              run_ids=observation.get("matched_run_ids") or ([observation.get("workflow_run_id")] if observation.get("workflow_run_id") else [])
              if len(run_ids) != 1:
                  raise SystemExit("SAMUEL_BOOTSTRAP=HARD_STOP ambiguous diagnostic run "+str(run_ids))
              open("samuel-diagnostic-run-id.txt","w").write(str(run_ids[0])+"\n")
              print("SAMUEL_BOOTSTRAP=DIAGNOSTIC_DISPATCHED action_id="+selected["action_id"])
              raise SystemExit(0)
          pending=load_pending("automation/samuel/bootstrap.json")
          selected_id=selected.get("work_id") if selected.get("kind") == "pending" else None
          pending=[work for work in pending if work.work_id == selected_id]
          if not pending:
              print("SAMUEL_BOOTSTRAP=IDLE")
          for work in pending:
              provider=resolve_bootstrap_provider(work)
              if provider.contract != "github-native-dispatch":
                  raise SystemExit("SAMUEL_BOOTSTRAP=HARD_STOP invalid provider contract")
              print("SAMUEL_BOOTSTRAP_PROVIDER="+provider.name)
              outcome=dispatch_and_wait(
                  transport,
                  workflow=work.workflow,
                  ref=work.ref,
                  inputs={},
                  correlation_id=work.work_id,
                  correlation_input=None,
                  expected_head_sha=sha if work.ref == os.environ.get("GITHUB_REF_NAME") else None,
                  timeout_seconds=600,
                  poll_interval_seconds=5,
              )
              observation=outcome["observation"]
              if observation.get("status") != "MATCHED_TERMINAL" or observation.get("conclusion") != "success":
                  raise SystemExit("SAMUEL_BOOTSTRAP=HARD_STOP "+str(observation))
              run_ids=observation.get("matched_run_ids") or ([observation.get("workflow_run_id")] if observation.get("workflow_run_id") else [])
              if len(run_ids) != 1:
                  raise SystemExit("SAMUEL_BOOTSTRAP=HARD_STOP ambiguous qualification run "+str(run_ids))
              open("samuel-qualified-run-id.txt","w").write(str(run_ids[0])+"\n")
              print("SAMUEL_BOOTSTRAP=PASS "+work.work_id)
          PY

      - name: Persist acquired diagnostic evidence
        if: ${{ hashFiles('samuel-evidence-run-id.txt') != '' }}
        env:
          PYTHONPATH: src
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="$(cat samuel-evidence-run-id.txt)"
          artifact_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts")"
          artifact_id="$(python3 -c 'import json,sys; xs=[x for x in json.load(sys.stdin)["artifacts"] if x["name"]=="samuel-evidence-result" and not x.get("expired")]; assert len(xs)==1; print(xs[0]["id"])' <<<"$artifact_json")"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" -o evidence.zip
          rm -rf evidence-result && mkdir evidence-result
          unzip -q evidence.zip -d evidence-result
          gh api "repos/$GITHUB_REPOSITORY/issues/44/comments?per_page=100" > current-comments.json
          python3 - <<'PY'
          import json
          from chatgpt_operation.controller.durable_state import (
              apply_evidence_patch, load_state_comment, prepare_state_write,
          )
          comments=json.load(open("current-comments.json"))
          current=load_state_comment(comments)
          if current is None:
              raise SystemExit("SAMUEL_EVIDENCE=HARD_STOP durable state disappeared")
          artifact=json.load(open("evidence-result/samuel-evidence-result.json"))
          proposed=apply_evidence_patch(current,artifact)
          write=prepare_state_write(comments,proposed)
          open("samuel-controller-state-body.txt","w").write(write["body"])
          open("samuel-controller-state-comment-id.txt","w").write(
              "" if write["comment_id"] is None else str(write["comment_id"])
          )
          PY
          body="$(cat samuel-controller-state-body.txt)"
          comment_id="$(cat samuel-controller-state-comment-id.txt)"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/44/comments" -f body="$body" >/dev/null
          fi

      - name: Persist durable action completion
        if: ${{ hashFiles('samuel-action-run-id.txt') != '' }}
        env:
          PYTHONPATH: src
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="$(cat samuel-action-run-id.txt)"
          artifact_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts")"
          artifact_id="$(python3 -c 'import json,sys; xs=[x for x in json.load(sys.stdin)["artifacts"] if x["name"].startswith("samuel-execution-result-") and not x.get("expired")]; assert len(xs)==1; print(xs[0]["id"])' <<<"$artifact_json")"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" -o action-result.zip
          rm -rf action-result && mkdir action-result
          unzip -q action-result.zip -d action-result
          gh api "repos/$GITHUB_REPOSITORY/issues/44/comments?per_page=100" > current-comments.json
          python3 - <<'PY'
          import json
          from chatgpt_operation.controller.execution import ExecutionResult
          from chatgpt_operation.controller.durable_state import (
              apply_action_completion, load_state_comment, prepare_state_write,
          )
          comments=json.load(open("current-comments.json"))
          current=load_state_comment(comments)
          if current is None:
              raise SystemExit("SAMUEL_ACTION=HARD_STOP durable state disappeared")
          raw=json.load(open("action-result/samuel-execution-result.json"))
          result=ExecutionResult.from_dict(raw)
          if result.status.value in {"PASS","NOOP"}:
              proposed=apply_action_completion(current,result)
          elif result.status.value == "FAILED":
              from chatgpt_operation.controller.durable_state import apply_action_failure
              proposed=apply_action_failure(current,result)
          else:
              raise SystemExit("SAMUEL_ACTION=HARD_STOP unsupported terminal result "+result.status.value)
          write=prepare_state_write(comments,proposed)
          open("samuel-controller-state-body.txt","w").write(write["body"])
          open("samuel-controller-state-comment-id.txt","w").write(
              "" if write["comment_id"] is None else str(write["comment_id"])
          )
          print("SAMUEL_ACTION="+("COMPLETE" if result.status.value in {"PASS","NOOP"} else "FAILED_RECORDED")+" action_id="+result.action_id)
          PY
          body="$(cat samuel-controller-state-body.txt)"
          comment_id="$(cat samuel-controller-state-comment-id.txt)"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/44/comments" -f body="$body" >/dev/null
          fi

      - name: Persist diagnostic recovery state
        if: ${{ hashFiles('samuel-diagnostic-run-id.txt') != '' }}
        env:
          PYTHONPATH: src
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="$(cat samuel-diagnostic-run-id.txt)"
          artifact_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts")"
          artifact_id="$(python3 -c 'import json,sys; xs=[x for x in json.load(sys.stdin)["artifacts"] if x["name"]=="samuel-diagnostic-result"]; assert len(xs)==1; print(xs[0]["id"])' <<<"$artifact_json")"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" -o diagnostic.zip
          rm -rf diagnostic-result && mkdir diagnostic-result
          unzip -q diagnostic.zip -d diagnostic-result
          gh api "repos/$GITHUB_REPOSITORY/issues/44/comments?per_page=100" > current-comments.json
          python3 - <<'PY'
          import json
          from chatgpt_operation.controller.durable_state import (
              apply_diagnostic_patch,
              load_state_comment,
              prepare_state_write,
          )
          comments=json.load(open("current-comments.json"))
          current=load_state_comment(comments)
          if current is None:
              raise SystemExit("SAMUEL_DIAGNOSTIC=HARD_STOP durable state disappeared")
          artifact=json.load(open("diagnostic-result/samuel-diagnostic-result.json"))
          if artifact.get("advanced") is not True:
              print("SAMUEL_DIAGNOSTIC=WAIT "+str(artifact.get("evidence","")))
              raise SystemExit(0)
          proposed=apply_diagnostic_patch(current,artifact)
          write=prepare_state_write(comments,proposed)
          open("samuel-controller-state-body.txt","w").write(write["body"])
          open("samuel-controller-state-comment-id.txt","w").write(
              "" if write["comment_id"] is None else str(write["comment_id"])
          )
          PY
          if [ -f samuel-controller-state-body.txt ]; then
            body="$(cat samuel-controller-state-body.txt)"
            comment_id="$(cat samuel-controller-state-comment-id.txt)"
            if [ -n "$comment_id" ]; then
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -f body="$body" >/dev/null
            else
              gh api --method POST "repos/$GITHUB_REPOSITORY/issues/44/comments" -f body="$body" >/dev/null
            fi
          fi

      - name: Verify qualification artifact and persist durable ledger
        if: ${{ hashFiles('samuel-qualified-run-id.txt') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="$(cat samuel-qualified-run-id.txt)"
          artifact_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts")"
          artifact_id="$(python3 -c 'import json,sys; x=json.load(sys.stdin)["artifacts"]; assert len(x)==1; print(x[0]["id"])' <<<"$artifact_json")"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" -o qualification.zip
          rm -rf qualification-evidence && mkdir qualification-evidence
          unzip -q qualification.zip -d qualification-evidence
          python3 - <<'PY'
          import json, os
          result=json.load(open("qualification-evidence/samuel-qualification-result.json"))
          checkpoint=result.get("checkpoint") or {}
          assert result.get("status") == "BLOCKED"
          assert result.get("continuation") == "RETRY"
          assert result.get("blocker") == "github_write_permission"
          assert result.get("http_code") == 403
          assert checkpoint.get("hypothesis")
          assert checkpoint.get("experiment")
          assert checkpoint.get("test_result")
          assert checkpoint.get("stage") == "decide"
          ledger={
            "schema_version":1,
            "work_id":"issue-44-write-blocker-qualification",
            "qualification_run_id":int(open("samuel-qualified-run-id.txt").read()),
            "status":"BLOCKED",
            "continuation":"RETRY",
            "blocker":"github_write_permission",
            "http_code":403,
            "checkpoint":checkpoint,
            "bootstrap_run_id":int(os.environ["GITHUB_RUN_ID"]),
            "bootstrap_head_sha":os.environ["GITHUB_SHA"],
          }
          open("samuel-bootstrap-ledger.json","w").write(json.dumps(ledger,sort_keys=True,separators=(",",":")))
          PY
          marker='<!-- samuel-bootstrap-ledger -->'
          body="$marker
          \`\`\`json
          $(cat samuel-bootstrap-ledger.json)
          \`\`\`"
          comments="$(gh api "repos/$GITHUB_REPOSITORY/issues/44/comments?per_page=100")"
          comment_id="$(python3 -c 'import json,sys; m="<!-- samuel-bootstrap-ledger -->"; xs=json.load(sys.stdin); ids=[x["id"] for x in xs if m in x.get("body","")]; assert len(ids)<=1; print(ids[0] if ids else "")' <<<"$comments")"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/44/comments" -f body="$body" >/dev/null
          fi
