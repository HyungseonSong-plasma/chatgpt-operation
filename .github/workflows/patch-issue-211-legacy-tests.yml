name: Patch Issue 211 Legacy Tests

on:
  push:
    branches:
      - samuel/issue-211-predispatch-recovery
    paths:
      - .github/workflows/patch-issue-211-legacy-tests.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: samuel/issue-211-predispatch-recovery
      - name: Update legacy fail-closed expectations
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 -B tools/patch_issue_211_legacy_tests.py
          python3 -B -m unittest \
            tests.test_controller_runtime.ControllerRuntimeTests.test_semantic_provider_cannot_use_controller_only_status_comment \
            tests.test_controller_runtime.ControllerRuntimeTests.test_semantic_provider_cannot_use_unverified_workflow_dispatch \
            tests.test_predispatch_recovery -v
          git diff --check
      - name: Commit only the updated regression file
        run: |
          set -euo pipefail
          git config user.name "samuel-operator"
          git config user.email "samuel-operator@users.noreply.github.com"
          git add tests/test_controller_runtime.py
          git diff --cached --check
          git commit -m "Align legacy fail-closed tests with durable recovery"
          git push origin HEAD:samuel/issue-211-predispatch-recovery
