name: Samuel Agent Child Parent Audit (Read Only)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: read

concurrency:
  group: samuel-agent-child-parent-audit
  cancel-in-progress: false

jobs:
  observe:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'HyungseonSong-plasma' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout audited source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Confirm exact reviewed commit
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Read independently verified Child evidence only
        env:
          PYTHONPATH: src
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m chatgpt_operation.controller.agent_issue_parent_audit \
            --output samuel-child-parent-audit.json
      - name: Upload review-only parent audit
        uses: actions/upload-artifact@v4
        with:
          name: samuel-agent-child-parent-audit-${{ github.run_id }}
          path: samuel-child-parent-audit.json
          if-no-files-found: error
          retention-days: 30
